<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1264" width="430" height="1264" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC ハーネス v2：生成と検証の流れ</title>
<desc id="d">任意の調査ステップ（既定でオン）の後、HCD を作って検証する。ワーカーが HCD から候補をコードで抽出し、FRG は TLF の分解とこのボトムアップ候補を照合して組み立てる。整合チェック X1〜X9 を記録し、X1・X2・X3・X8 があれば実行ごとに一度の調整ターンを送る。調整では FRG の修正、HCD の UC の分割・追加、理由を残して維持を選べる。変更された HCD と FRG を再検証した後、CSV、2 種類の xlsx、グラフをコードで生成する。仮説は明示的な許可、対象、主張の種類、割合の制約の下で扱う。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="1264" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="30" rx="8" fill="#1e3a8a"/><text x="215" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>CoBRAC ハーネス v2：生成と検証の流れ</tspan></text>
<rect x="10" y="58" width="410" height="80" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="85.14999999999999" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>仮説は明示的に許可したときだけ</tspan></text>
<text x="22" y="103.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>対象・主張の種類・割合を検査</tspan></text>
<text x="22" y="120.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>根拠と FRG への依存を記録</tspan></text>
<rect x="10" y="162" width="410" height="82" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="190.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>1. 調査（任意・既定でオン）</tspan></text>
<text x="22" y="208.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>文献検索 → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">research.json</tspan></text>
<text x="22" y="225.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>網羅性の検査と修正</tspan></text>
<path d="M215 244 L215 272" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="272" width="410" height="86" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="302.15000000000003" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>2. HCD：回路・接続を作る</tspan></text>
<text x="22" y="320.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>UC / Collection / 接続 / 文献</tspan></text>
<text x="22" y="337.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Schema・命名・BRA・文献・引用文を検証</tspan></text>
<path d="M215 358 L215 386" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="386" width="410" height="82" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="414.15000000000003" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>HCD から候補をコードで抽出</tspan></text>
<text x="22" y="432.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">frg_candidates.json</tspan></text>
<text x="22" y="449.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>モチーフ・経路・境界を FRG の材料に</tspan></text>
<path d="M215 468 L215 496" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="496" width="410" height="86" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="526.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>3. FRG：機能を回路に対応させる</tspan></text>
<text x="22" y="544.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>TLF の分解 × ボトムアップ候補</tspan></text>
<text x="22" y="561.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>GN・Interface・機能の内容を検証</tspan></text>
<path d="M215 582 L215 610" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="610" width="410" height="86" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="640.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>4. 整合チェック X1〜X9</tspan></text>
<text x="22" y="658.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">cross_check.json</tspan><tspan> に記録</tspan></text>
<text x="22" y="675.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>X1・X2・X3・X8 があれば調整へ</tspan></text>
<path d="M215 696 L215 724" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="38" y="724" width="382" height="116" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="50" y="760.4499999999999" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>調整ターン（実行ごとに最大 1 回）</tspan></text>
<text x="50" y="778.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>FRG を修正 / HCD の UC を分割・追加</tspan></text>
<text x="50" y="796.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>または維持する理由を記録</tspan></text>
<text x="50" y="813.65" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>その後の検証・修正ループへ</tspan></text>
<path d="M10 653 L3 653 L3 856 L215 856" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-3b82f6)"/>
<path d="M215 840 L215 876" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="10" y="876" width="410" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="902.15" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>HCD↔FRG の変更理由を残す</tspan></text>
<text x="22" y="920.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">decision_log.md</tspan></text>
<text x="22" y="937.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">## HCD-FRG revisions</tspan><tspan> に記録</tspan></text>
<path d="M215 954 L215 982" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="982" width="410" height="98" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="1009.4499999999999" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>5. 変更された HCD / FRG を再検証</tspan></text>
<text x="22" y="1027.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">phase_baseline.json</tspan><tspan> で変更を検出</tspan></text>
<text x="22" y="1045.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>後段でも前段の検証をやり直す</tspan></text>
<text x="22" y="1062.65" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>仮説は対象・割合・依存関係も再確認</tspan></text>
<path d="M215 1080 L215 1108" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="10" y="1108" width="410" height="98" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="1135.45" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>6. コードで成果物を生成</tspan></text>
<text x="22" y="1153.8500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CSV 5 本 → xlsx × 2</tspan></text>
<text x="22" y="1171.2500000000002" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CoBRAC-v1-1 / Template-v2-2</tspan></text>
<text x="22" y="1188.6500000000003" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>同じデータから HCD / FRG グラフ</tspan></text>
<text x="10" y="1233" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>各段階：編集 → 検証 → 必要な修正</tspan></text>
<text x="10" y="1251" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>質問時は保存して中断し、回答後に再開</tspan></text>
</svg>
