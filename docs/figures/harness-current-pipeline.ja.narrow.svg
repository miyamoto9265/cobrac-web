<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1228" width="430" height="1228" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC ハーネス v2：1 件の BRA の流れと書き手</title>
<desc id="d">左の列は CoBRAC エージェント（LLM）のターン、右の列はワーカー（プログラム）の処理で、矢印はファイルと依頼文の受け渡しを表す。1. 調査ターン（既定で有効）でエージェントが research.json を書き、ワーカーが検索ログと被覆を照合して research_check.json を書く。2. HCD ターンでエージェントが uc.json・connections.json などを書き、ワーカーが Schema・命名・文献・引用を検証する。ワーカーは受理した HCD から経路やモチーフを計算して frg_candidates.json を書き、FRG の依頼文に入れる。3. FRG ターンでエージェントが frg.json とレポートの対応表を書き、ワーカーが GN と interface を検査し、整合チェック X1〜X9 を cross_check.json に書く。4. X1・X2・X3・X8 があれば、ワーカーが調整依頼を 1 回送り、エージェントが FRG か HCD を直すか理由を残す。ワーカーは変更されたファイルを再検証する。5. ワーカーが JSON から CSV 5 本、xlsx 2 種、グラフを生成し、保存版にする。この段に LLM は関与しない。各段で問題が残ればワーカーが問題一覧を付けて修正を依頼する。</desc>
