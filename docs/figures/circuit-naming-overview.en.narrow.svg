<rect x="10" y="418" width="410" height="56" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="215" y="441.85" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>UC Descriptor (machine key)</tspan></text>
<text x="215" y="460.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">HOMBA:10341/mol:DRD1+</tspan></text>
<path d="M215 474 L215 498" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
