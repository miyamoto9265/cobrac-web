<text x="215" y="222.85000000000002" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>Names cannot tell if it is the same population</tspan></text>
<text x="215" y="241.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>and they have no link to an atlas</tspan></text>
