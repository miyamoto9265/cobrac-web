<text x="215" y="542.4375" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">NACs(DRD1+)</tspan></text>
<rect x="51.5" y="566" width="327.0" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="61.52000000000001" y="582.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>The same descriptor is the same UC in every project</tspan></text>
