<text x="640" y="251.4875" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>Circuit ID (human-readable alias)</tspan></text>
<text x="640" y="270.4375" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">NACs(DRD1+)</tspan></text>
<rect x="476.5" y="294" width="327.0" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="486.52" y="310.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>The same descriptor is the same UC in every project</tspan></text>
