<rect x="20" y="52" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="32" y="75.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Project A</tspan></text>
<text x="32" y="94.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">NAc_shell_D1</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">L-DLPFC</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">CA3-Pyr</tspan></text>
<rect x="20" y="118" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="32" y="141.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Project B</tspan></text>
<text x="32" y="160.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">NACs-DRD1</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">DLPFC_L</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">CA3pyr</tspan></text>
<text x="416" y="190" font-size="11" font-weight="400" fill="#475569" text-anchor="end"><tspan>(names are illustrative)</tspan></text>
<rect x="20" y="200" width="400" height="54" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="220" y="222.85000000000002" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>Names cannot tell if it is the same population</tspan></text>
<text x="220" y="241.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>and they have no link to an atlas</tspan></text>
