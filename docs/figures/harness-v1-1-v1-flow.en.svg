<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 570" width="860" height="570" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Data flow of harness v1 (app 0.5–0.6)</title>
<desc id="d">The agent writes six HCD markdown files plus meta.json and five FRG markdown files. The worker parses the tables of 2_BIF.md, 3_UC.md, 4_Connection.md, 3_FinalFRG.md and 4_FunctionDetails.md with markdown.ts, checks them with checkHcd and checkFrg, and builds five CSVs with buildCsvs. The other markdown files are only checked for existence. When the CSVs could not be built, the agent typed them by hand following phases/CSV.md. Only the xlsx and graphs were visible in the app.</desc>
