<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 434" width="860" height="434" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Reading older forms (v0.17.0)</title>
<desc id="d">Stored data is not rewritten. When read, a UC Descriptor is brought to the current form by canonicalUcDescriptor: BNA:57 becomes BNA:57-58/side:left, BNAG:FuG@L becomes BNAG:FuG/side:left and HOMBA:12261@R becomes HOMBA:12261/side:right. A Circuit ID is brought to the current form by modernCircuitId: A4ul@L(L5,pt,out:Sp) becomes A4ul(L5.pt.out-Sp.left), NAC(shell,DRD1+) becomes NAC(shell.DRD1+) and A9/46d@L(L3) becomes A9/46d(L3.left). The checks ask for the current form at the next follow-up, the Canon compares old and current forms as the same circuit and the same ID, and the viewer and the CSV / xlsx show the stored ID as it is.</desc>
