<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 284" width="860" height="284" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">並列化で縮められる範囲が小さい理由</title>
<desc id="d">調査 → HCD → FRG → 調整ターン → CSV・xlsx は、前の段の結果を入力にするので直列でしか進められない。HCD は UC・接続・Collection が互いに依存する 1 つのグラフ、FRG は 1 本の木で、分けて作ると結合のときに整合をとり直す必要がある。並列にできるのは調査ステップの証拠集めくらいだが、OpenAI の組織の TPM 上限は gpt-6-luna で 20 万トークン/分で、1 本のスレッドだけで平均 14〜17 万トークン/分を使っているため、2 本目を足すとすぐ上限に当たる。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="284" fill="#ffffff"/>
<rect x="10" y="10" width="840" height="30" rx="8" fill="#64748b"/><text x="430" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>前の段の結果を入力にするので、段は直列</tspan></text>
<rect x="10" y="54" width="147.2" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="83.6" y="77.85" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle"><tspan>調査</tspan></text>
<text x="83.6" y="96.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>候補の投射</tspan></text>
<path d="M157.2 82 L183.2 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="183.2" y="54" width="147.2" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="256.79999999999995" y="77.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>HCD</tspan></text>
<text x="256.79999999999995" y="96.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>1 つのグラフ</tspan></text>
<path d="M330.4 82 L356.4 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="356.4" y="54" width="147.2" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430" y="77.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>FRG</tspan></text>
<text x="430" y="96.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>1 本の木</tspan></text>
<path d="M503.59999999999997 82 L529.5999999999999 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="529.5999999999999" y="54" width="147.2" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="603.1999999999999" y="77.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>調整ターン</tspan></text>
<text x="603.1999999999999" y="96.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>両方を見て直す</tspan></text>
<path d="M676.8 82 L702.8 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="702.8" y="54" width="147.2" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="776.4" y="77.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>CSV・xlsx</tspan></text>
<text x="776.4" y="96.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>0.1 分</tspan></text>
<text x="83.6" y="130" font-size="12" font-weight="400" fill="#92400e" text-anchor="middle"><tspan>↑ 並列にできる余地はここだけ（数分）</tspan></text>
<text x="10" y="164" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>OpenAI の組織の TPM 上限（gpt-6-luna）</tspan></text>
<rect x="10" y="178" width="840" height="30" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
<rect x="10" y="178" width="490.0" height="30" rx="4" fill="#4338ca"/>
<rect x="500.0" y="178" width="105.0" height="30" fill="#4338ca" opacity="0.45"/>
<text x="20" y="198" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start"><tspan>1 本のスレッドの平均 14〜17 万/分</tspan></text>
<line x1="710.0" y1="170" x2="710.0" y2="218" stroke="#ef4444" stroke-width="2.5"/>
<text x="710" y="234" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>上限 20 万/分</tspan></text>
<text x="10" y="234" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start"><tspan>0k</tspan></text>
<text x="360" y="234" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle"><tspan>100k</tspan></text>
<text x="850" y="252" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>トークン/分</tspan></text>
<text x="10" y="274" font-size="12.5" font-weight="600" fill="#991b1b" text-anchor="start"><tspan>2 本目を足すと上限に当たる</tspan></text>
</svg>
