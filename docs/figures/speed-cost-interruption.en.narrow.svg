<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 765.8" width="430" height="765.8" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Resuming after a Spot interruption: up to v0.18.1 and from v0.18.2</title>
<desc id="d">Up to v0.18.1 the workspace was saved only when a phase was accepted, a question was asked, or the job completed or failed. A Fargate Spot interruption (SIGTERM two minutes ahead) ended the task without saving, so the work since the last save was lost. The housekeeping job (janitor), every 15 minutes, retried the job once its heartbeat was 15 minutes old, so the job resumed 15–30 minutes after the interruption. From v0.18.2 the worker saves the workspace and the thread to S3 every 5 minutes during a turn, and on SIGTERM saves at once (120 s allowed) and marks its heartbeat stale. The janitor runs every 5 minutes, so the job resumes from the saved state about 5 minutes later.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="765.8" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="30" rx="8" fill="#f59e0b"/><text x="215" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>Up to v0.18.1</tspan></text>
<rect x="10" y="52" width="410" height="64.8" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="71.55" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Turn running</tspan></text>
<text x="22" y="89.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>saved only on phase accept,</tspan></text>
<text x="22" y="107.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>question, done or failure</tspan></text>
<path d="M215 116.8 L215 132.8" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="134.8" width="410" height="64.8" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="22" y="154.35000000000002" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>Spot interruption</tspan></text>
<text x="22" y="172.75" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>SIGTERM is ignored</tspan></text>
<text x="22" y="190.15" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>work since last save is lost</tspan></text>
<path d="M215 199.60000000000002 L215 215.60000000000002" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="217.60000000000002" width="410" height="64.8" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="22" y="237.15000000000003" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>Waiting to detect</tspan></text>
<text x="22" y="255.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>heartbeat 15 min old</tspan></text>
<text x="22" y="272.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>janitor every 15 min</tspan></text>
<path d="M215 282.40000000000003 L215 298.40000000000003" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="300.40000000000003" width="410" height="64.8" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="319.95000000000005" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Resume</tspan></text>
<text x="22" y="338.35" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>15–30 min after the stop</tspan></text>
<text x="22" y="355.75" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>from the last save</tspan></text>
<rect x="10" y="383.20000000000005" width="410" height="30" rx="8" fill="#3b82f6"/><text x="215" y="403.20000000000005" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>From v0.18.2</tspan></text>
<rect x="10" y="425.20000000000005" width="410" height="64.8" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="444.75000000000006" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Turn running</tspan></text>
<text x="22" y="463.15000000000003" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>workspace and thread</tspan></text>
<text x="22" y="480.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>saved to S3 every 5 min</tspan></text>
<path d="M215 490.00000000000006 L215 506.00000000000006" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="508.00000000000006" width="410" height="82.19999999999999" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="527.55" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Spot interruption</tspan></text>
<text x="22" y="545.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>save at once on SIGTERM</tspan></text>
<text x="22" y="563.35" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>(120 s allowed), then</tspan></text>
<text x="22" y="580.75" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>mark the heartbeat stale</tspan></text>
<path d="M215 590.2 L215 606.2" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="608.2" width="410" height="64.8" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="627.75" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Janitor</tspan></text>
<text x="22" y="646.1500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>runs every 5 min,</tspan></text>
<text x="22" y="663.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>retries on its next run</tspan></text>
<path d="M215 673 L215 689" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="691" width="410" height="64.8" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="710.55" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Resume</tspan></text>
<text x="22" y="728.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>about 5 min after the stop</tspan></text>
<text x="22" y="746.35" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>from the saved state</tspan></text>
</svg>
