<text x="22" y="244.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>2. HCD ターン</tspan></text>
<text x="22" y="262.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ROI・UC・接続・文献を決める</tspan></text>
<text x="22" y="279.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">uc.json</tspan><tspan>・</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">connections.json</tspan><tspan> ほか</tspan></text>
