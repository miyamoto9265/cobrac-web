<rect x="10" y="54" width="380" height="30" rx="8" fill="#4c1d95"/><text x="200" y="74" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>CoBRAC エージェント（LLM）：判断してファイルを書く</tspan></text>
<rect x="470" y="54" width="380" height="30" rx="8" fill="#1e3a8a"/><text x="660" y="74" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>ワーカー（プログラム）：検査・計算・変換</tspan></text>
<rect x="10" y="106" width="380" height="74" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="130.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>1. 調査ターン（既定で有効）</tspan></text>
<text x="22" y="148.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>候補ごとに文献を探して読む</tspan></text>
<text x="22" y="165.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">research.json</tspan></text>
