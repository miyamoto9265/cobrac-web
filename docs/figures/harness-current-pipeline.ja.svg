<path d="M470 500 L390 500" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-3b82f6)"/>
<text x="430" y="516" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>修正依頼</tspan></text>
<path d="M560 522 L560 542 L200 542 L200 562" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-f59e0b)"/>
<text x="380" y="538" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>X1・X2・X3・X8 → 調整依頼</tspan></text>
<path d="M760 522 L760 562" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="768" y="546" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>該当なし</tspan></text>
<rect x="10" y="562" width="380" height="74" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="586.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>4. 調整ターン（該当時のみ・1 回）</tspan></text>
<text x="22" y="604.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>FRG か HCD を直す、または理由を残す</tspan></text>
<text x="22" y="621.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">decision_log.md</tspan><tspan> の revisions</tspan></text>
<rect x="470" y="562" width="380" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="482" y="586.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>変更されたファイルの再検証</tspan></text>
<text x="482" y="604.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>前段の検査もやり直す</tspan></text>
<text x="482" y="621.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">phase_baseline.json</tspan></text>
<path d="M390 588 L470 588" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="430" y="582" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>ファイル</tspan></text>
