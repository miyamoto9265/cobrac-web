<text x="430" y="630" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>修正依頼</tspan></text>
<path d="M660 636 L660 676" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="668" y="660" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>受理</tspan></text>
<rect x="10" y="676" width="380" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="708.8499999999999" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>この段に LLM は関与しない</tspan></text>
<text x="22" y="727.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CSV の問題は JSON の修正依頼で戻る</tspan></text>
<rect x="470" y="676" width="380" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="482" y="700.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>5. 成果物の生成と保存</tspan></text>
<text x="482" y="718.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>JSON → CSV 5 本 → xlsx 2 種・グラフ</tspan></text>
<text x="482" y="735.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ 保存版 </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">&lt;ProjectID&gt;@vN</tspan></text>
<text x="10" y="782" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>どのターンでもエージェントは質問できる。ワーカーが保存して停止し、回答後に同じ会話で再開する。</tspan></text>
<text x="10" y="802" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>仮説は利用者が許可したときだけ書ける。範囲と比率はワーカーが検査する。</tspan></text>
</svg>
