<text x="482" y="262.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Schema・命名・文献・引用を照合</tspan></text>
<text x="482" y="279.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">quote_check.json</tspan><tspan> ほか</tspan></text>
<path d="M390 246 L470 246" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="430" y="240" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>ファイル</tspan></text>
<path d="M470 272 L390 272" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-3b82f6)"/>
<text x="430" y="288" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>修正依頼</tspan></text>
<path d="M660 294 L660 334" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="668" y="318" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>受理</tspan></text>
<rect x="470" y="334" width="380" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="482" y="358.15000000000003" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>FRG 候補の計算</tspan></text>
<text x="482" y="376.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>HCD の接続から経路・モチーフを抽出</tspan></text>
<text x="482" y="393.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">frg_candidates.json</tspan></text>
<path d="M560 408 L560 428 L200 428 L200 448" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="380" y="424" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>候補を FRG の依頼文に入れる</tspan></text>
<rect x="10" y="448" width="380" height="74" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="472.15000000000003" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>3. FRG ターン</tspan></text>
<text x="22" y="490.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>TLF を分解し、候補と対応づける</tspan></text>
<text x="22" y="507.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">frg.json</tspan><tspan>・report の対応表</tspan></text>
<rect x="470" y="448" width="380" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="482" y="472.15000000000003" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>FRG の検証と整合チェック</tspan></text>
<text x="482" y="490.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>GN・interface を検査、X1〜X9 を計算</tspan></text>
<text x="482" y="507.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">cross_check.json</tspan></text>
<path d="M390 474 L470 474" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
