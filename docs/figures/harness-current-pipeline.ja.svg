<text x="430" y="126" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>ファイル</tspan></text>
<path d="M470 158 L390 158" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-3b82f6)"/>
<text x="430" y="174" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>修正依頼</tspan></text>
