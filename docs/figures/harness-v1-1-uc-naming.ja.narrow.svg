<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 909" width="430" height="909" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">UC 記述子と Circuit ID の組み立て方</title>
<desc id="d">UC Descriptor の例 HOMBA:12261/nt:DA/out:BNA:223-224/resp:rpe は、アンカー HOMBA:12261（腹側被蓋野、DHBA 略称 VTA）に、伝達物質 nt:DA、投射先 out:BNA:223-224（側坐核、BNA 略称 NAC）、応答 resp:rpe のファセットを足したもの。Circuit ID はアンカーの略称を先頭に、ファセットを括弧内に並べて VTA(DA,out:NAC,rpe) になる。ふつうはアンカーだけで、HOMBA:12261 なら VTA。アンカーは、領域の語だけを取り出し、RCS で候補を検索し、DHBA 語なら HOMBA の ID、BNA の領域なら BNA のラベルに決め、必要なときだけファセットを足す。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="909" fill="#ffffff"/>
<rect x="10" y="10" width="204" height="30" rx="8" fill="#8b5cf6"/><text x="112" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>UC Descriptor</tspan></text>
<rect x="258" y="10" width="162" height="30" rx="8" fill="#0d9488"/><text x="339" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>Circuit ID</tspan></text>
<rect x="10" y="50" width="410" height="32" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="215" y="70.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">HOMBA:12261/nt:DA/out:BNA:223-224/resp:rpe</tspan></text>
<path d="M215 82 L215 96" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="10" y="96" width="410" height="32" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="215" y="116.6875" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">VTA(DA,out:NAC,rpe)</tspan></text>
<rect x="10" y="144" width="204" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="163.15" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">HOMBA:12261</tspan></text>
<text x="22" y="179.1" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>アンカー：腹側被蓋野</tspan></text>
<rect x="258" y="144" width="162" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="270" y="163.15" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">VTA</tspan></text>
<text x="270" y="179.1" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>見出し = DHBA 略称</tspan></text>
<path d="M214 167 L258 167" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="10" y="200" width="204" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="219.15" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">/nt:DA</tspan></text>
<text x="22" y="235.1" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>伝達物質</tspan></text>
<rect x="258" y="200" width="162" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="270" y="219.15" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">DA</tspan></text>
<text x="270" y="235.1" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>括弧内の項目</tspan></text>
<path d="M214 223 L258 223" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="256" width="204" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="275.15000000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">/out:BNA:223-224</tspan></text>
<text x="22" y="291.1" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>投射先：側坐核</tspan></text>
<rect x="258" y="256" width="162" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="270" y="275.15000000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">out:NAC</tspan></text>
<text x="270" y="291.1" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>相手の SABRA 略称</tspan></text>
<path d="M214 279 L258 279" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="312" width="204" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="331.15000000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">/resp:rpe</tspan></text>
<text x="22" y="347.1" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>応答</tspan></text>
<rect x="258" y="312" width="162" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="270" y="339.125" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">rpe</tspan></text>
<path d="M214 335 L258 335" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="10" y="384" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start"><tspan>ふつうはアンカーだけ：</tspan></text>
<text x="22" y="402" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">HOMBA:12261</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">VTA</tspan></text>
<text x="22" y="419" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">BNA:223-224</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">NAC</tspan></text>
<text x="22" y="436" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">BNA:57</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">A4ul@L</tspan></text>
<text x="10" y="477" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>アンカーの決め方</tspan></text>
<rect x="10" y="487" width="410" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="506.7" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>1. 領域の語だけ</tspan></text>
<text x="22" y="524.35" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>細胞・層・伝達物質などの</tspan></text>
<text x="22" y="541.025" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>語を外す</tspan></text>
<path d="M215 551 L215 565" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="10" y="565" width="410" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="584.7" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>2. RCS で検索</tspan></text>
<text x="22" y="602.35" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">search_homba_candidates</tspan></text>
<text x="22" y="619.025" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>結果の </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">sabra.atlas</tspan><tspan> を見る</tspan></text>
<path d="M215 629 L215 643" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="10" y="643" width="410" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="662.7" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>3. アンカーを決める</tspan></text>
<text x="22" y="680.35" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>DHBA 語 → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">HOMBA:&lt;id&gt;</tspan></text>
<text x="22" y="697.025" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>BNA 領域 → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">BNA:&lt;n&gt;</tspan></text>
<path d="M215 707 L215 721" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="10" y="721" width="410" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="740.7" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>4. 必要なら細分</tspan></text>
<text x="22" y="758.35" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ファセットを足す</tspan></text>
<text x="22" y="775.025" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">part</tspan><tspan>・</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">nt</tspan><tspan>・</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">out</tspan><tspan> など）</tspan></text>
<text x="10" y="813" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="start"><tspan>ワーカーの検査：</tspan></text>
<text x="22" y="831" font-size="11.5" font-weight="400" fill="#065f46" text-anchor="start"><tspan>・構文とファセットの順</tspan></text>
<text x="22" y="848" font-size="11.5" font-weight="400" fill="#065f46" text-anchor="start"><tspan>・略称の一致（RCS / BNA 表）</tspan></text>
<text x="22" y="865" font-size="11.5" font-weight="400" fill="#065f46" text-anchor="start"><tspan>・項目とファセットの対応</tspan></text>
<text x="22" y="882" font-size="11.5" font-weight="400" fill="#065f46" text-anchor="start"><tspan>・記述子の重複</tspan></text>
</svg>
