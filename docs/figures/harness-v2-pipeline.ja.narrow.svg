<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 796" width="430" height="796" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">パイプラインの比較：v1.1 と v2</title>
<desc id="d">v1.1 は HCD → FRG → CSV → xlsx を 1 回ずつ進む。受理したフェーズには戻らず、FRG の段で HCD を直しても検査されず、HCD と FRG の整合は見ない。v2 は任意の調査ステップ（既定でオン）から始まり、HCD → FRG の後に整合チェック X1〜X9 を記録する。X1〜X3・X8 があれば調整ターンを 1 回送り、エージェントは FRG を直すか、HCD の手順 3 に戻って UC を分ける・足す。HCD が変わったら HCD の検証をやり直してから CSV に進み、xlsx は CoBRAC-v1-1 と Template-v2-2 の 2 種類を作る。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="796" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="30" rx="8" fill="#0d9488"/><text x="215" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v1.1（アプリ 0.8）：1 回ずつ前へ進む</tspan></text>
<rect x="10" y="52" width="88" height="36" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="54" y="74.55" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>HCD</tspan></text>
<path d="M98 70 L117.33333333333333 70" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="117.33333333333333" y="52" width="88" height="36" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="161.33333333333331" y="74.55" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>FRG</tspan></text>
<path d="M205.33333333333331 70 L224.66666666666666 70" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="224.66666666666666" y="52" width="88" height="36" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="268.66666666666663" y="74.55" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>CSV</tspan></text>
<path d="M312.66666666666663 70 L332 70" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="332" y="52" width="88" height="36" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="376" y="74.55" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>xlsx</tspan></text>
<circle cx="199.33333333333331" cy="54" r="11" fill="#ef4444"/><text x="199.33333333333331" y="58.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<circle cx="22" cy="106" r="11" fill="#ef4444"/><text x="22" y="110.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<text x="40" y="111" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>FRG は「完成した HCD」から作る。HCD に戻る道がない</tspan></text>
<circle cx="22" cy="128" r="11" fill="#ef4444"/><text x="22" y="132.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<text x="40" y="133" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>FRG の段で HCD を直しても、その変更は検査されない</tspan></text>
<circle cx="22" cy="150" r="11" fill="#ef4444"/><text x="22" y="154.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
<text x="40" y="155" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>HCD と FRG が合っているかは見ない</tspan></text>
<rect x="10" y="182" width="410" height="30" rx="8" fill="#4338ca"/><text x="215" y="202" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v2（アプリ 0.13〜）：戻り道と整合チェック</tspan></text>
<rect x="10" y="224" width="220" height="62" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="243.425" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>調査ステップ</tspan></text>
<text x="22" y="260.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>既定でオン</tspan></text>
<text x="22" y="276.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">research.json</tspan></text>
<path d="M120 286 L120 304" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="304" width="220" height="62" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="323.425" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>HCD</tspan></text>
<text x="22" y="340.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>BRA の値</tspan></text>
<text x="22" y="356.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>文献・引用文</tspan></text>
<path d="M120 366 L120 384" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="384" width="220" height="62" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="403.425" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>FRG</tspan></text>
<text x="22" y="420.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>手順 3 に</tspan></text>
<text x="22" y="436.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>HCD への戻り道</tspan></text>
<path d="M120 446 L120 464" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="464" width="220" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="483.425" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>整合チェック</tspan></text>
<text x="22" y="500.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>X1〜X9</tspan></text>
<text x="22" y="516.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>（記録と調整）</tspan></text>
<path d="M120 526 L120 544" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="544" width="220" height="62" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="563.425" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="start"><tspan>CSV</tspan></text>
<text x="22" y="580.525" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>JSON から</tspan></text>
<text x="22" y="596.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>コードで生成</tspan></text>
<path d="M120 606 L120 624" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="624" width="220" height="62" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="643.425" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="start"><tspan>xlsx × 2</tspan></text>
<text x="22" y="660.525" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CoBRAC-v1-1</tspan></text>
<text x="22" y="676.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Template-v2-2</tspan></text>
<rect x="262" y="458" width="158" height="104" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="274" y="490.09999999999997" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>調整ターン（1 回）</tspan></text>
<text x="274" y="506.8" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>どちらを直すかを</tspan></text>
<text x="274" y="522.75" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>証拠で決め、</tspan></text>
<text x="274" y="538.7" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>revisions 節に記録</tspan></text>
<path d="M230 495 L262 495" fill="none" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow-ef4444)"/>
<text x="246" y="487" font-size="9.5" font-weight="400" fill="#991b1b" text-anchor="middle"><tspan>X1–3, X8</tspan></text>
<path d="M288 458 L288 335 L230 335" fill="none" stroke="#8b5cf6" stroke-width="2.2" marker-end="url(#arrow-8b5cf6)"/>
<text x="296" y="357" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>UC を分ける・足す</tspan></text>
<text x="296" y="372" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="start"><tspan>（粗い単位は</tspan></text>
<text x="296" y="387" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="start"><tspan>Collection に）</tspan></text>
<circle cx="412" cy="460" r="11" fill="#10b981"/><text x="412" y="464.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<path d="M361 562 L361 575 L230 575" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="369" y="580" font-size="11" font-weight="400" fill="#475569" text-anchor="start"><tspan>再検証して</tspan></text>
<text x="369" y="594" font-size="11" font-weight="400" fill="#475569" text-anchor="start"><tspan>CSV へ</tspan></text>
<circle cx="222" cy="466" r="11" fill="#10b981"/><text x="222" y="470.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
<circle cx="22" cy="716" r="11" fill="#10b981"/><text x="22" y="720.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<rect x="40.0" y="704" width="236.9" height="23.5" rx="11.75" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="50" y="719.89" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="start"><tspan>HCD が変わったら HCD の検証をやり直す</tspan></text>
<text x="50" y="744" font-size="11" font-weight="400" fill="#065f46" text-anchor="start"><tspan>（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">phase_baseline.json</tspan><tspan>）</tspan></text>
<text x="12" y="764" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>① HCD への戻り道と調整ターン</tspan></text>
<text x="203.44" y="764" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>② 後段での HCD の再検証</tspan></text>
<text x="12" y="784" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>③ HCD↔FRG 整合チェック</tspan></text>
</svg>
