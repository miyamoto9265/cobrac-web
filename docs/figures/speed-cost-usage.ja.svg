<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 194" width="860" height="194" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">使用量の二重計上：累計をターンごとに足していた</title>
<desc id="d">Codex がターンの終わりに返す使用量は、そのターンの分ではなくスレッドの累計。テストユーザーの実行では、3 ターン目までの累計が 327 万、583 万、609 万トークン（入力）だった。0.17.0 までのワーカーはこの累計を毎ターン足していたので、記録は 1,518 万になった。0.17.1 からは、ターン後の累計からターン前の累計を引いた差分（327 万、256 万、26 万）だけを足し、記録は実際と同じ 609 万になる。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="194" fill="#ffffff"/>
<text x="248" y="28" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>Codex が返す値（スレッドの累計）</tspan></text>
<rect x="260" y="10" width="91.8" height="18" rx="2" fill="#6366f1" opacity="0.85"/>
<text x="357.84528124999997" y="23.5" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start"><tspan>1 ターン目 3.27</tspan></text>
<rect x="260" y="32" width="163.9" height="18" rx="2" fill="#a855f7" opacity="0.85"/>
<text x="429.875628125" y="45.5" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start"><tspan>2 ターン目 5.83</tspan></text>
<rect x="260" y="54" width="171.2" height="18" rx="2" fill="#ec4899" opacity="0.85"/>
<text x="437.24117187499996" y="67.5" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start"><tspan>3 ターン目 6.09</tspan></text>
<text x="248" y="110" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>0.17.0 まで：累計を毎ターン足す</tspan></text>
<rect x="260.0" y="92" width="91.8" height="26" fill="#6366f1" stroke="#ffffff" stroke-width="1"/>
<text x="305.922640625" y="109.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3.27</tspan></text>
<rect x="351.8" y="92" width="163.9" height="26" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>
<text x="433.7830953125" y="109.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>5.83</tspan></text>
<rect x="515.7" y="92" width="171.2" height="26" fill="#ec4899" stroke="#ffffff" stroke-width="1"/>
<text x="601.3414953125" y="109.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>6.09</tspan></text>
<text x="694.96208125" y="105" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>= 15.18</tspan></text>
<text x="694.96208125" y="120" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>実際の約 2.5 倍</tspan></text>
<text x="248" y="156" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>0.17.1 から：差分だけを足す</tspan></text>
<rect x="260.0" y="138" width="91.8" height="26" fill="#6366f1" stroke="#ffffff" stroke-width="1"/>
<text x="305.922640625" y="155.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3.27</tspan></text>
<rect x="351.8" y="138" width="72.0" height="26" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>
<text x="387.86045468749995" y="155.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2.56</tspan></text>
<rect x="423.9" y="138" width="7.4" height="26" fill="#ec4899" stroke="#ffffff" stroke-width="1"/>
<text x="439.24117187499996" y="151" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>= 6.09</tspan></text>
<text x="439.24117187499996" y="166" font-size="11" font-weight="400" fill="#1e3a8a" text-anchor="start"><tspan>実際と同じ</tspan></text>
<text x="850" y="184" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>百万トークン（入力）</tspan></text>
</svg>
