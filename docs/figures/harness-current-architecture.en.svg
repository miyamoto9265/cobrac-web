<text x="502" y="413.15000000000003" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>RCS + </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">lit</tspan><tspan> (MCP)</tspan></text>
