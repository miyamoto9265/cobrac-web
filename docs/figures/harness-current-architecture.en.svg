<text x="322" y="105.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Authentication, settings, requests</tspan></text>
<text x="322" y="122.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>State and messages: DynamoDB</tspan></text>
<rect x="610" y="58" width="240" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="622" y="87.14999999999999" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>SQS → dispatcher</tspan></text>
