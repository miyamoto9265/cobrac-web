<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 281" width="860" height="281" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Resuming after a Spot interruption: up to v0.18.1 and from v0.18.2</title>
<desc id="d">Up to v0.18.1 the workspace was saved only when a phase was accepted, a question was asked, or the job completed or failed. A Fargate Spot interruption (SIGTERM two minutes ahead) ended the task without saving, so the work since the last save was lost. The housekeeping job (janitor), every 15 minutes, retried the job once its heartbeat was 15 minutes old, so the job resumed 15–30 minutes after the interruption. From v0.18.2 the worker saves the workspace and the thread to S3 every 5 minutes during a turn, and on SIGTERM saves at once (120 s allowed) and marks its heartbeat stale. The janitor runs every 5 minutes, so the job resumes from the saved state about 5 minutes later.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="281" fill="#ffffff"/>
<rect x="10" y="10" width="840" height="30" rx="8" fill="#f59e0b"/><text x="430" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>Up to v0.18.1</tspan></text>
<rect x="10" y="52" width="192" height="68.8" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="73.55" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Turn running</tspan></text>
<text x="22" y="91.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>saved only on phase accept,</tspan></text>
<text x="22" y="109.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>question, done or failure</tspan></text>
<path d="M202 86.4 L226 86.4" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="226" y="52" width="192" height="68.8" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="238" y="73.55" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>Spot interruption</tspan></text>
<text x="238" y="91.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>SIGTERM is ignored</tspan></text>
<text x="238" y="109.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>work since last save is lost</tspan></text>
<path d="M418 86.4 L442 86.4" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="442" y="52" width="192" height="68.8" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="454" y="73.55" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>Waiting to detect</tspan></text>
<text x="454" y="91.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>heartbeat 15 min old</tspan></text>
<text x="454" y="109.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>janitor every 15 min</tspan></text>
<path d="M634 86.4 L658 86.4" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="658" y="52" width="192" height="68.8" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="670" y="73.55" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Resume</tspan></text>
<text x="670" y="91.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>15–30 min after the stop</tspan></text>
<text x="670" y="109.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>from the last save</tspan></text>
<rect x="10" y="140.8" width="840" height="30" rx="8" fill="#3b82f6"/><text x="430" y="160.8" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>From v0.18.2</tspan></text>
<rect x="10" y="182.8" width="192" height="86.19999999999999" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="213.05" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Turn running</tspan></text>
<text x="22" y="231.45" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>workspace and thread</tspan></text>
<text x="22" y="248.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>saved to S3 every 5 min</tspan></text>
<path d="M202 225.9 L226 225.9" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="226" y="182.8" width="192" height="86.19999999999999" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="238" y="204.35000000000002" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Spot interruption</tspan></text>
<text x="238" y="222.75" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>save at once on SIGTERM</tspan></text>
<text x="238" y="240.15" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>(120 s allowed), then</tspan></text>
<text x="238" y="257.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>mark the heartbeat stale</tspan></text>
<path d="M418 225.9 L442 225.9" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="442" y="182.8" width="192" height="86.19999999999999" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="454" y="213.05" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Janitor</tspan></text>
<text x="454" y="231.45" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>runs every 5 min,</tspan></text>
<text x="454" y="248.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>retries on its next run</tspan></text>
<path d="M634 225.9 L658 225.9" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="658" y="182.8" width="192" height="86.19999999999999" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="670" y="213.05" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Resume</tspan></text>
<text x="670" y="231.45" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>about 5 min after the stop</tspan></text>
<text x="670" y="248.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>from the saved state</tspan></text>
</svg>
