<text x="215" y="774.375" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>CSV → xlsx</tspan></text>
<rect x="10" y="802" width="410" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
