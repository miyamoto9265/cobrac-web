<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 876" width="430" height="876" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif" style="font-variant-ligatures:none">
<title id="t">調整ターンと HCD への戻り道</title>
<desc id="d">FRG の段が終わると、ワーカーは checkCross で HCD と FRG の整合を調べ、cross_check.json に記録する。X1・X2・X3・X8 がなければ記録だけで CSV に進む（X4〜X6・X9 は数えるだけ）。あれば実行ごとに 1 回、調整ターンを送る。エージェントは証拠に基づいて、FRG を直す（TLF の分解を細かくする、GN の Interface を直す）、HCD の手順 3 に戻る（UC を分ける・足す、粗い単位は Collection、新しい接続には文献と引用文）、直さずに理由を残す、のどれかを選び、decision_log.md の HCD-FRG revisions 節に 1 行 1 変更でタグ付きで書く。HCD が変わっていれば、ワーカーは HCD の検証を全部やり直してから CSV と xlsx を作る。X9（粒度）はまだ調整のきっかけにしていない。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="876" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="215" y="31.4" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>FRG の段が終わる</tspan></text>
<text x="215" y="48.5" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>受理でも、警告を残した場合でも</tspan></text>
<path d="M215 60 L215 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="82" width="410" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="215" y="104.4" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>整合チェック（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">checkCross</tspan><tspan>）</tspan></text>
<text x="215" y="121.5" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>結果は </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">cross_check.json</tspan><tspan> とチャットの件数</tspan></text>
<path d="M215 134 L215 156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="156" width="250" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="135" y="180.375" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle"><tspan>X1・X2・X3・X8 がある？</tspan></text>
<rect x="280" y="142" width="140" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="159.36249999999998" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>記録だけ</tspan></text>
<text x="350" y="175.7125" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>X4〜X6・X9 は</tspan></text>
<text x="350" y="190.9375" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>数えるだけ</tspan></text>
<text x="350" y="206.1625" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>そのまま CSV へ</tspan></text>
<path d="M260 182 L280 182" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="270" y="172" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>ない</tspan></text>
