<text x="215" y="242.425" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>調整ターン（実行ごとに 1 回）</tspan></text>
<text x="215" y="259.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>所見の一覧と各検査の意味を渡す</tspan></text>
<text x="215" y="275.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>「どちらを直すかを証拠で決めよ」</tspan></text>
<path d="M215 286 L215 294 L20 294" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
<rect x="34" y="300" width="386" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="319.45" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>FRG を直す</tspan></text>
<text x="46" y="336.55" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>TLF の分解を細かくする</tspan></text>
<text x="46" y="352.5" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>GN の Interface を直す</tspan></text>
<text x="46" y="368.45" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>（証拠がないときもこちら）</tspan></text>
<path d="M20 339 L34 339" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="34" y="388" width="386" height="78" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="46" y="407.45" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>HCD に戻る（手順 3）</tspan></text>
<text x="46" y="424.55" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>UC を分ける・足す</tspan></text>
<text x="46" y="440.5" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>粗い単位は Collection にする</tspan></text>
<text x="46" y="456.45" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>新しい接続には文献と引用文</tspan></text>
<path d="M20 427 L34 427" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="34" y="476" width="386" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="46" y="495.425" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>直さない</tspan></text>
<text x="46" y="512.525" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>食い違いとその理由を</tspan></text>
<text x="46" y="528.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[kept]</tspan><tspan> の行に書く</tspan></text>
<path d="M20 507 L34 507" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<path d="M20 294 L20 507" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
<circle cx="412" cy="390" r="11" fill="#10b981"/><text x="412" y="394.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<path d="M215 538 L215 568" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow-f59e0b)"/>
<text x="223" y="557" font-size="11" font-weight="400" fill="#92400e" text-anchor="start"><tspan>どれを選んでも記録する</tspan></text>
<rect x="10" y="568" width="410" height="78" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="215" y="587.45" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">## HCD-FRG revisions</tspan><tspan> 節</tspan></text>
<text x="215" y="604.5500000000001" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">decision_log.md</tspan><tspan> に 1 行 1 変更</tspan></text>
<text x="215" y="620.5000000000001" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[FRG-&gt;HCD]</tspan><tspan> </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[HCD-&gt;FRG]</tspan></text>
<text x="215" y="636.4500000000002" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[instruction]</tspan><tspan> </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[kept]</tspan></text>
