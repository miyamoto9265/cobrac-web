<text x="215" y="687.425" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>HCD が変わったら全部を再検証</tspan></text>
<text x="215" y="704.525" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>命名・RCS・BRA の値・文献・引用文</tspan></text>
<text x="215" y="720.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">phase_baseline.json</tspan><tspan> のハッシュ）</tspan></text>
<circle cx="412" cy="670" r="11" fill="#10b981"/><text x="412" y="674.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<path d="M215 730 L215 752" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
