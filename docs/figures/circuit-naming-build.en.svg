<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 506" width="860" height="506" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Building the Circuit ID from the UC Descriptor</title>
<desc id="d">The Circuit ID A4ul(L5.pt.out-Sp.left) is built from the UC Descriptor BNA:57-58/lay:L5/cell:pt/out:HOMBA:AA30565/side:left. The anchor BNA:57-58 becomes its official abbreviation A4ul, and the facet values follow in the parentheses in descriptor order, separated by a dot. The layer L5 and the cell class pt stay as they are, the projection target out:HOMBA:AA30565 (spinal cord) becomes out-Sp, and side:left becomes the last item left. The nine facet axes are part, lay, cell, nt, mol, in, out, resp and side, in this order; empty axes are left out.</desc>
