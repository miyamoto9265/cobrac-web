<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 254" width="430" height="254" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">使用量の二重計上：累計をターンごとに足していた</title>
<desc id="d">Codex がターンの終わりに返す使用量は、そのターンの分ではなくスレッドの累計。テストユーザーの実行では、3 ターン目までの累計が 327 万、583 万、609 万トークン（入力）だった。0.17.0 までのワーカーはこの累計を毎ターン足していたので、記録は 1,518 万になった。0.17.1 からは、ターン後の累計からターン前の累計を引いた差分（327 万、256 万、26 万）だけを足し、記録は実際と同じ 609 万になる。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="254" fill="#ffffff"/>
<text x="10" y="22" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Codex が返す値（スレッドの累計）</tspan></text>
<rect x="10" y="30" width="55.1" height="18" rx="2" fill="#6366f1" opacity="0.85"/>
<text x="71.10716875" y="43.5" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start"><tspan>1 ターン目 3.27</tspan></text>
<rect x="10" y="52" width="98.3" height="18" rx="2" fill="#a855f7" opacity="0.85"/>
<text x="114.325376875" y="65.5" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start"><tspan>2 ターン目 5.83</tspan></text>
<rect x="10" y="74" width="102.7" height="18" rx="2" fill="#ec4899" opacity="0.85"/>
<text x="118.74470312499999" y="87.5" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start"><tspan>3 ターン目 6.09</tspan></text>
<text x="10" y="124" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>0.17.0 まで：累計を毎ターン足す</tspan></text>
<rect x="10.0" y="132" width="55.1" height="26" fill="#6366f1" stroke="#ffffff" stroke-width="1"/>
<text x="37.553584375" y="149.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3.27</tspan></text>
<rect x="65.1" y="132" width="98.3" height="26" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>
<text x="114.26985718750001" y="149.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>5.83</tspan></text>
<rect x="163.4" y="132" width="102.7" height="26" fill="#ec4899" stroke="#ffffff" stroke-width="1"/>
<text x="214.80489718750002" y="149.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>6.09</tspan></text>
<text x="274.17724875" y="145" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>= 15.18</tspan></text>
<text x="274.17724875" y="160" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>実際の約 2.5 倍</tspan></text>
<text x="10" y="190" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>0.17.1 から：差分だけを足す</tspan></text>
<rect x="10.0" y="198" width="55.1" height="26" fill="#6366f1" stroke="#ffffff" stroke-width="1"/>
<text x="37.553584375" y="215.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3.27</tspan></text>
<rect x="65.1" y="198" width="43.2" height="26" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>
<text x="86.7162728125" y="215.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2.56</tspan></text>
<rect x="108.3" y="198" width="4.4" height="26" fill="#ec4899" stroke="#ffffff" stroke-width="1"/>
<text x="120.74470312499999" y="211" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>= 6.09</tspan></text>
<text x="120.74470312499999" y="226" font-size="11" font-weight="400" fill="#1e3a8a" text-anchor="start"><tspan>実際と同じ</tspan></text>
<text x="420" y="244" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>百万トークン（入力）</tspan></text>
</svg>
