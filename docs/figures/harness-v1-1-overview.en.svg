<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Harness v1 vs v1.1: data format and UC names</title>
<desc id="d">In v1 the agent wrote its data as markdown tables that the worker parsed back and checked. Circuit IDs were free names, the agent typed the CSVs by hand when they could not be built, and only the xlsx and graphs were visible in the app. In v1.1 the agent writes JSON and names each UC after a SABRA unit found with RCS. The worker checks JSON Schemas and the UC naming rules, always builds the CSVs, xlsx and graphs in code, and the report and decision log can be read in the app.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="360" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="10" y="10" width="410" height="36" rx="12" fill="#3b82f6"/>
<rect x="10" y="34" width="410" height="12" fill="#3b82f6"/>
<text x="215" y="33" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v1 (app 0.5–0.6): data as markdown tables</tspan></text>
<rect x="26" y="62" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="84.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Worker</tspan></text>
<text x="38" y="104.52499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Parses the markdown tables back to check them</tspan></text>
<text x="38" y="123.37499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Has the agent type CSVs when they fail</tspan></text>
<text x="38" y="142.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Only the xlsx and graphs are visible</tspan></text>
<path d="M80 156 L80 212" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="92" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>phase spec</tspan></text>
<text x="92" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>problem list</tspan></text>
<path d="M350 212 L350 156" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="338" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>markdown tables</tspan></text>
<text x="338" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>(</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">\|</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">&lt;br&gt;</tspan><tspan> escapes)</tspan></text>
<rect x="26" y="214" width="378" height="92" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="236.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex agent</tspan></text>
<text x="38" y="256.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Writes data as tables (6 HCD, 5 FRG files)</tspan></text>
<text x="38" y="275.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Circuit IDs are free names</tspan></text>
<text x="38" y="294.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Also writes verification notes and drafts</tspan></text>
