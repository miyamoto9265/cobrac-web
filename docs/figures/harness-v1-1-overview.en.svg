<text x="100.88000000000007" y="330.32" font-size="12" font-weight="600" fill="#991b1b" text-anchor="start"><tspan>Data format: markdown tables (parsed)</tspan></text>
<rect x="440" y="10" width="410" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="440" y="10" width="410" height="36" rx="12" fill="#0d9488"/>
<rect x="440" y="34" width="410" height="12" fill="#0d9488"/>
<text x="645" y="33" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v1.1 (app 0.8+): data as JSON</tspan></text>
<rect x="456" y="62" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="468" y="84.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Worker (CoBRAC harness v1.1)</tspan></text>
<text x="468" y="104.52499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Checks JSON Schemas and UC naming rules</tspan></text>
<text x="468" y="123.37499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Always builds CSVs, xlsx and graphs in code</tspan></text>
<text x="468" y="142.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Report and decision log visible in the app</tspan></text>
<path d="M510 156 L510 212" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="522" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>phase spec</tspan></text>
<text x="522" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>problems + JSON pointer</tspan></text>
<path d="M780 212 L780 156" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="768" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>4 JSON files</tspan></text>
<text x="768" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>+ 2 markdown</tspan></text>
<rect x="456" y="214" width="378" height="92" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="468" y="236.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex agent + RCS</tspan></text>
<text x="468" y="256.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Writes data as JSON (3 HCD, 1 FRG file)</tspan></text>
<text x="468" y="275.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Anchors each UC on a SABRA unit via RCS</tspan></text>
<text x="468" y="294.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Markdown only for report and decision log</tspan></text>
<rect x="506.7" y="314" width="276.6" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="516.72" y="330.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>Data format: JSON (guaranteed by schemas)</tspan></text>
</svg>
