<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 570" width="860" height="570" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">ハーネス v1 のデータの流れ（アプリ 0.5〜0.6）</title>
<desc id="d">エージェントは HCD の md 6 本と meta.json、FRG の md 5 本を書く。ワーカーは 2_BIF.md、3_UC.md、4_Connection.md、3_FinalFRG.md、4_FunctionDetails.md の表を markdown.ts でパースし、checkHcd と checkFrg で検査し、buildCsvs で CSV 5 本を作る。残りの md は存在を確認するだけ。CSV が作れないときは、エージェントが phases/CSV.md に従って CSV を手書きした。画面で見られるのは xlsx とグラフだけ。</desc>
