<text x="260" y="534" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>終了 JSON</tspan></text>
<rect x="26" y="548" width="378" height="118" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="576.75" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>CoBRAC エージェント（LLM）</tspan></text>
<text x="38" y="595.1500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Codex が OpenAI のモデルを動かす</tspan></text>
<text x="38" y="612.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>文献を読み、回路と機能を判断</tspan></text>
<text x="38" y="629.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>作業場所のファイルを書き換える</tspan></text>
