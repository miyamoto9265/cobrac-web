<rect x="26" y="392" width="378" height="118" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="420.75" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>ワーカー（プログラム・LLM なし）</tspan></text>
<text x="38" y="439.15" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>段の順序と依頼文を決める</tspan></text>
