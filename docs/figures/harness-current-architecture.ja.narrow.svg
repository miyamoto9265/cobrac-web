<text x="22" y="1074.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>作業場所・会話・成果物・保存版</tspan></text>
<rect x="10" y="1102" width="410" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="1125.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>進捗と質問の表示</tspan></text>
