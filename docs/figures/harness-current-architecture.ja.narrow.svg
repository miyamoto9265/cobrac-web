<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1152" width="430" height="1152" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC ハーネス v2：全体のアーキテクチャ</title>
<desc id="d">利用者の入力を Web 画面と API がジョブにし、SQS を読む dispatcher が Fargate ワーカーを起動する。ワーカーが Codex エージェントへフェーズ仕様と修正指示を送り、エージェントは RCS と lit を使って JSON と説明文を作る。ワーカーはファイルを検証し、コードで CSV・xlsx・グラフを生成して S3 に保存する。質問時は作業ファイルと会話を保存して終了し、回答後に新しいワーカーが復元して再開する。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="1152" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="30" rx="8" fill="#1e3a8a"/><text x="215" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>CoBRAC ハーネス v2：全体のアーキテクチャ</tspan></text>
<rect x="10" y="58" width="410" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="83.14999999999999" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>利用者 / Web 画面</tspan></text>
<text x="22" y="101.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ROI・TLF・資料・追加指示</tspan></text>
<text x="22" y="118.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>進捗・質問・成果物を表示</tspan></text>
<path d="M215 134 L215 158" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="158" width="410" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="183.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>API / ジョブ管理</tspan></text>
<text x="22" y="201.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>認証・設定・実行受付</tspan></text>
<text x="22" y="218.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>状態とメッセージ：DynamoDB</tspan></text>
<path d="M215 234 L215 258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="258" width="410" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="283.15000000000003" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>SQS → dispatcher</tspan></text>
<text x="22" y="301.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>同時実行数を制御</tspan></text>
<text x="22" y="318.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ジョブごとにワーカーを起動</tspan></text>
<path d="M215 334 L215 358" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="358" width="410" height="424" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="22" y="378" font-size="12.5" font-weight="700" fill="#3b82f6" text-anchor="start"><tspan>Fargate ワーカー：実行を管理する CoBRAC ハーネス</tspan></text>
<rect x="26" y="398" width="378" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="423.15000000000003" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>フェーズ制御</tspan></text>
<text x="38" y="441.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>調査 → HCD → FRG → CSV</tspan></text>
<text x="38" y="458.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>検証結果から修正・再検証を指示</tspan></text>
<path d="M180 474 L180 512" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<path d="M250 512 L250 474" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="164" y="497" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="end"><tspan>仕様・修正指示</tspan></text>
<text x="266" y="497" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>JSON・md・状態</tspan></text>
<rect x="26" y="512" width="378" height="76" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="537.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex エージェント</tspan></text>
<text x="38" y="555.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>回路と機能を推論し JSON を編集</tspan></text>
<text x="38" y="572.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>report / decision_log を記録</tspan></text>
<path d="M215 588 L215 608" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="26" y="608" width="378" height="68" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="629.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>RCS + </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">lit</tspan><tspan>（MCP）</tspan></text>
<text x="38" y="647.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>RCS：SABRA（利用可能な場合）</tspan></text>
<text x="38" y="664.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>lit：PubMed / Europe PMC（常時）</tspan></text>
<rect x="26" y="694" width="378" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="710.4499999999999" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>検証器</tspan></text>
<text x="38" y="728.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Schema・命名・BRA・HCD↔FRG</tspan></text>
<text x="38" y="746.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>文献・引用文・許可された仮説</tspan></text>
<text x="38" y="763.65" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>検証結果をファイルに記録</tspan></text>
<path d="M26 436 L18 436 L18 732 L26 732" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<path d="M215 770 L215 807" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="10" y="807" width="410" height="82" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="835.875" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>コードで成果物を生成</tspan></text>
<text x="22" y="853.725" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>JSON → CSV → xlsx × 2 / HCD・FRG グラフ</tspan></text>
<text x="22" y="870.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CoBRAC-v1-1 / Template-v2-2</tspan></text>
<path d="M215 889 L215 913" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="10" y="913" width="410" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="936.15" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>S3 に保存</tspan></text>
<text x="22" y="954.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>作業ファイル・会話</tspan></text>
<text x="22" y="971.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>成果物・版の履歴</tspan></text>
<text x="10" y="1008" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>進捗：DynamoDB → WebSocket → 画面</tspan></text>
<text x="10" y="1026" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>成果物は API 経由で参照</tspan></text>
<rect x="10" y="1046" width="410" height="96" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="22" y="1072.45" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>質問が必要なときは、保存して待つ</tspan></text>
<text x="22" y="1090.8500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>質問 → 作業ファイルと会話を S3 に保存</tspan></text>
<text x="22" y="1108.2500000000002" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ワーカー終了 → 利用者が回答</tspan></text>
<text x="22" y="1125.6500000000003" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>API / SQS → 新しいワーカーが復元して再開</tspan></text>
</svg>
