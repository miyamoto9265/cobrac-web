<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 512" width="860" height="512" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">How a UC Descriptor and a Circuit ID are built</title>
<desc id="d">The UC Descriptor HOMBA:12261/nt:DA/out:BNA:223-224/resp:rpe is the anchor HOMBA:12261 (ventral tegmental area, DHBA abbreviation VTA) plus the facets transmitter nt:DA, projection target out:BNA:223-224 (nucleus accumbens, BNA abbreviation NAC) and response resp:rpe. The Circuit ID puts the anchor's abbreviation first and the facets in parentheses: VTA(DA,out:NAC,rpe). The anchor alone is the normal case: HOMBA:12261 is just VTA. To find the anchor, keep only the region words, search RCS, take the HOMBA ID for a DHBA term or the BNA label for a BNA area, and add facets only when needed.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="512" fill="#ffffff"/>
<rect x="20" y="10" width="330" height="30" rx="8" fill="#8b5cf6"/><text x="185" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>UC Descriptor (the key)</tspan></text>
<rect x="540" y="10" width="300" height="30" rx="8" fill="#0d9488"/><text x="690" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>Circuit ID (readable alias)</tspan></text>
<rect x="20" y="50" width="330" height="34" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="185" y="71.6875" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">HOMBA:12261/nt:DA/out:BNA:223-224/resp:rpe</tspan></text>
<rect x="540" y="50" width="300" height="34" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="690" y="71.875" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">VTA(DA,out:NAC,rpe)</tspan></text>
<path d="M350 67 L540 67" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="20" y="100" width="330" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="32" y="118.8" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">HOMBA:12261</tspan></text>
<text x="32" y="136.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>anchor: ventral tegmental area</tspan></text>
<rect x="540" y="100" width="300" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="552" y="118.8" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">VTA</tspan></text>
<text x="552" y="136.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>head = DHBA abbreviation</tspan></text>
<path d="M350 123 L540 123" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="20" y="156" width="330" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="32" y="174.79999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">/nt:DA</tspan></text>
<text x="32" y="192.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>transmitter</tspan></text>
<rect x="540" y="156" width="300" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="552" y="174.79999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">DA</tspan></text>
<text x="552" y="192.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>items in parentheses</tspan></text>
<path d="M350 179 L540 179" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="20" y="212" width="330" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="32" y="230.79999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">/out:BNA:223-224</tspan></text>
<text x="32" y="248.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>target: nucleus accumbens</tspan></text>
<rect x="540" y="212" width="300" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="552" y="230.79999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">out:NAC</tspan></text>
<text x="552" y="248.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>partner's SABRA abbr.</tspan></text>
<path d="M350 235 L540 235" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="20" y="268" width="330" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="32" y="286.8" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">/resp:rpe</tspan></text>
<text x="32" y="304.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>response</tspan></text>
<rect x="540" y="268" width="300" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="552" y="295.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">rpe</tspan></text>
<path d="M350 291 L540 291" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="430" y="340" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle"><tspan>The anchor alone is the normal case: </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">HOMBA:12261</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">VTA</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">BNA:223-224</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">NAC</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">BNA:57</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">A4ul@L</tspan></text>
<text x="20" y="378" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Finding the anchor</tspan></text>
<rect x="20" y="388" width="193" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="32" y="412.425" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>1. Region words only</tspan></text>
<text x="32" y="429.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>drop cell, layer and</tspan></text>
<text x="32" y="445.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>transmitter words</tspan></text>
<path d="M213 424 L229 424" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="229" y="388" width="193" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="241" y="412.425" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>2. Search RCS</tspan></text>
<text x="241" y="429.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">search_homba_candidates</tspan></text>
<text x="241" y="445.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>read </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">sabra.atlas</tspan></text>
<path d="M422 424 L438 424" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="438" y="388" width="193" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="450" y="412.425" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>3. Pick the anchor</tspan></text>
<text x="450" y="429.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>DHBA term → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">HOMBA:&lt;id&gt;</tspan></text>
<text x="450" y="445.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>BNA area → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">BNA:&lt;n&gt;</tspan></text>
<path d="M631 424 L647 424" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="647" y="388" width="193" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="659" y="412.425" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>4. Refine if needed</tspan></text>
<text x="659" y="429.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>add facets</tspan></text>
<text x="659" y="445.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>(</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">part</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">nt</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">out</tspan><tspan>, …)</tspan></text>
<rect x="89.0" y="476" width="681.9" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="99.03999999999945" y="492.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>Worker checks: syntax and facet order, abbreviation match (RCS / BNA table), items vs facets, unique descriptors</tspan></text>
</svg>
