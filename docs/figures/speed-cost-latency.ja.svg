<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 212" width="860" height="212" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">コンテキストの長さと応答の待ち時間（4 件の実行、応答 482 回）</title>
<desc id="d">応答の待ち時間を、固定分 + 出力トークン数 ÷ 速さ として当てはめた。コンテキストが 8 万トークン未満の応答 203 回は固定分 3.9 秒、8〜12 万の 140 回は 16.3 秒、12 万超の 139 回は 41.8 秒。出力の速さはどれも約 110 トークン/秒で変わらない。モデル時間の合計は 48 分、81 分、124 分で、8 万以上の応答が 8 割を占める。圧縮の前後では、25〜68 秒だった応答が 2〜6 秒になる。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="212" fill="#ffffff"/>
<text x="10" y="20" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>1 回の応答の固定の待ち時間（秒）</tspan></text>
<text x="92" y="48" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>8 万未満</tspan></text>
<text x="92" y="63" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>203 回</tspan></text>
<rect x="102" y="36" width="22.0" height="26" rx="3" fill="#10b981"/>
<text x="130.01333333333332" y="54" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>3.9 秒</tspan></text>
<text x="92" y="88" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>8〜12 万</tspan></text>
<text x="92" y="103" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>140 回</tspan></text>
<rect x="102" y="76" width="92.0" height="26" rx="3" fill="#f59e0b"/>
<text x="200.00444444444446" y="94" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>16.3 秒</tspan></text>
<text x="92" y="128" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>12 万超</tspan></text>
<text x="92" y="143" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>139 回</tspan></text>
<rect x="102" y="116" width="235.9" height="26" rx="3" fill="#ef4444"/>
<text x="343.9377777777778" y="134" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>41.8 秒</tspan></text>
<text x="440" y="20" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>モデル時間の合計（分）</tspan></text>
<text x="522" y="48" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>8 万未満</tspan></text>
<text x="522" y="63" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>203 回</tspan></text>
<rect x="532" y="36" width="93.8" height="26" rx="3" fill="#10b981"/>
<text x="631.7846153846153" y="54" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>48 分</tspan></text>
<text x="522" y="88" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>8〜12 万</tspan></text>
<text x="522" y="103" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>140 回</tspan></text>
<rect x="532" y="76" width="158.3" height="26" rx="3" fill="#f59e0b"/>
<text x="696.2615384615385" y="94" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>81 分</tspan></text>
<text x="522" y="128" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end"><tspan>12 万超</tspan></text>
<text x="522" y="143" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>139 回</tspan></text>
<rect x="532" y="116" width="242.3" height="26" rx="3" fill="#ef4444"/>
<text x="780.2769230769231" y="134" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>124 分</tspan></text>
<text x="10" y="176" font-size="12.5" font-weight="600" fill="#475569" text-anchor="start"><tspan>行はリクエストのときのコンテキストの長さ（トークン）</tspan></text>
<text x="10" y="196" font-size="12.5" font-weight="600" fill="#475569" text-anchor="start"><tspan>出力の速さはどれも約 110 トークン/秒。圧縮の前後では 25〜68 秒 → 2〜6 秒</tspan></text>
</svg>
