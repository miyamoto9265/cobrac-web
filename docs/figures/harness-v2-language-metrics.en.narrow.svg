<title id="t">Three runs of the language area: v0, 0.11.0 and the back-edge trial</title>
<desc id="d">Three runs with the same ROI and TLF (nonword reading). ROI-internal UCs: v0 5, 0.11.0 4, trial 7. Collections: 0, 0, 3. Connection rows: 17, 14, 21. References: 19, 17, 21. Checked quotes: 0, 14, 21. FRG GNs: 8, 2, 4. FRG depth: 3, 2, 3. X9 cannot be measured on v0; 0.11.0 3, trial 0. Appendix D codes violated in the automatic check: v0 7, 0.11.0 1, the trial not measured. v0's UCs are free names, not anchored on SABRA units.</desc>
