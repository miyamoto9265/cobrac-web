<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1034" width="860" height="1034" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">v1 architecture: the worker drives the phases and verifies them</title>
<desc id="d">The worker (CoBRAC harness) prepares the workspace and writes AGENTS.md. In the HCD phase the prompt is a header plus phases/HCD.md; when the agent has written 6 HCD files and meta.json, checkHcd() checks them. If there are problems, a fix prompt with the exact list is sent (max 3) and the agent fixes only those problems. Once accepted, the FRG phase runs the same way with phases/FRG.md and checkFrg(). The CSV phase has no agent: buildCsvs() turns the markdown tables into 5 CSVs, and only if that fails does the agent write the CSVs through the fallback prompt phases/CSV.md. Finally csv_to_excel.py builds the .bra.xlsx and buildGraphs() the HCD/FRG JSON, which go to S3. At any turn, status question saves the state to S3, stops the task and waits for the user.</desc>
