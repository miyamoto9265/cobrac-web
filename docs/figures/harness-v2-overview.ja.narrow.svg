<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 714" width="430" height="714" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">ハーネス v1.1 と v2 の比較：一方通行から往復へ</title>
<desc id="d">v1.1 ではエージェントが HCD を仕上げてから FRG を作り、ワーカーは受理したフェーズに戻らず、HCD と FRG が合っているかも見なかった。v2 ではエージェントが調査ステップで文献を集め、FRG から HCD に戻って UC を分けたり足したりでき、その理由を revisions 節に書く。ワーカーは BRA の値・文献・引用文まで検査し、HCD↔FRG 整合チェック X1〜X9 を記録し、X1〜X3・X8 があれば調整ターンを 1 回送り、HCD が後段で変われば検証をやり直す。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="714" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="10" y="10" width="410" height="36" rx="12" fill="#0d9488"/>
<rect x="10" y="34" width="410" height="12" fill="#0d9488"/>
<text x="215" y="33" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v1.1（アプリ 0.8）：一方通行</tspan></text>
<rect x="26" y="62" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="84.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>ワーカー（CoBRAC ハーネス v1.1）</tspan></text>
<text x="38" y="104.52499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>JSON Schema と UC 命名規則で検査</tspan></text>
<text x="38" y="123.37499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>受理したフェーズには戻らない</tspan></text>
<text x="38" y="142.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>HCD と FRG が合っているかは見ない</tspan></text>
<path d="M80 156 L80 212" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="92" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>フェーズ仕様</tspan></text>
<text x="92" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>問題一覧</tspan></text>
<path d="M350 212 L350 156" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="338" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>JSON 4 本</tspan></text>
<text x="338" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>+ md 2 本</tspan></text>
<rect x="26" y="214" width="378" height="92" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="236.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex エージェント + RCS</tspan></text>
<text x="38" y="256.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>HCD を仕上げてから FRG を作る</tspan></text>
<text x="38" y="275.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>文献は知識と Web 検索から</tspan></text>
<text x="38" y="294.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>合わなければ FRG の側で合わせる</tspan></text>
<rect x="100.4" y="314" width="229.3" height="24" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="110.36000000000001" y="330.32" font-size="12" font-weight="600" fill="#991b1b" text-anchor="start"><tspan>流れ：HCD → FRG → CSV の一方通行</tspan></text>
<rect x="10" y="364" width="410" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="10" y="364" width="410" height="36" rx="12" fill="#4338ca"/>
<rect x="10" y="388" width="410" height="12" fill="#4338ca"/>
<text x="215" y="387" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v2（アプリ 0.13〜）：往復あり</tspan></text>
<rect x="26" y="416" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="438.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>ワーカー（CoBRAC ハーネス v2）</tspan></text>
<text x="38" y="458.52500000000003" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>BRA の値・文献・引用文まで検査</tspan></text>
<text x="38" y="477.37500000000006" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>HCD↔FRG 整合チェック X1〜X9</tspan></text>
<text x="38" y="496.2250000000001" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>HCD が後段で変われば検証し直す</tspan></text>
<path d="M80 510 L80 566" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="92" y="534" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>フェーズ仕様</tspan></text>
<text x="92" y="550" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>問題 + 調整ターン</tspan></text>
<path d="M350 566 L350 510" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="338" y="534" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>JSON + </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">research.json</tspan></text>
<text x="338" y="550" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>revisions 節</tspan></text>
<rect x="26" y="568" width="378" height="92" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="590.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex エージェント + RCS + </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.9" fill="#1e293b">lit</tspan></text>
<text x="38" y="610.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>調査ステップで文献を集める</tspan></text>
<text x="38" y="629.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>FRG から HCD に戻って UC を分ける</tspan></text>
<text x="38" y="648.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>往復の理由を revisions 節に書く</tspan></text>
<rect x="85.8" y="668" width="258.3" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="95.84" y="684.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>流れ：FRG → HCD の戻り道と整合チェック</tspan></text>
</svg>
