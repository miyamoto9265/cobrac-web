<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Harness v1.1 vs v2: from one-way to round trips</title>
<desc id="d">In v1.1 the agent finished the HCD before building the FRG; the worker never went back to an accepted phase and did not check whether the HCD and the FRG agree. In v2 the agent gathers literature in a research step, can go back from the FRG to the HCD to split or add UCs, and records why in the revisions section. The worker checks BRA values, references and quotes, records the HCD–FRG consistency checks X1–X9, sends one adjustment turn when X1–X3 or X8 are found, and validates the HCD again when a later step changes it.</desc>
