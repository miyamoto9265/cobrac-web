<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 368" width="860" height="368" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">成果物の出力量（v0 の実プロジェクト 5 件の平均から推定）</title>
<desc id="d">エージェントが書いた HCD/FRG の成果物全体 62,400 トークンから、初学者向け解説記事と Mermaid 図ファイル 9,100、FRG ファイル内の Mermaid ブロック 1,000、エージェントが打ち込んだ CSV 6,300、日本語部分を英語で書いた場合の差 10,300 を引き、v1 の成果物出力は約 35,700 トークン（約 43% 減）と推定される。</desc>
