<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 457.4" width="860" height="457.4" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">文献の流れ：生成中の lit ツールと、ワーカーの照合</title>
<desc id="d">生成中、エージェントは lit MCP サーバーの search_pubmed、search_europepmc、get_abstract、find_sentences で論文を探し、抄録や全文から文を取る。Europe PMC が答えないときは、書誌と抄録を PubMed から、全文を PMC（NCBI BioC）から取り、結果の note に落ちたサービスを書く。通信は 15 秒で打ち切り、1・2・4 秒おいて 3 回まで再試行し、3 回続けて失敗したホストは 5 分休み、呼び出しの間隔を空ける。エージェントは references.json と connections.json（論文の原文の引用）、調査モードでは research.json を書く。ワーカーは DOI を Crossref（なければ doi.org）、PMID を PubMed で照合し、第一著者・年・題名を確かめて reference_check.json に、引用文を全文（Europe PMC、PMC BioC）か抄録と照合して quote_check.json に記録する。mismatch と not_found は、一番近い箇所とリンクを添えて修正依頼として返し、照合できないだけ（unverified）なら止めない。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="457.4" fill="#ffffff"/>
<rect x="10" y="10" width="390" height="170" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="22" y="30" font-size="12.5" font-weight="700" fill="#8b5cf6" text-anchor="start"><tspan>生成中：エージェントの </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">lit</tspan><tspan> ツール</tspan></text>
<rect x="20" y="40" width="370" height="28" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="30" y="58.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">search_pubmed</tspan></text>
<text x="380" y="58.5" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>PubMed を検索</tspan></text>
<rect x="20" y="74" width="370" height="28" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="30" y="92.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">search_europepmc</tspan></text>
<text x="380" y="92.5" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>Europe PMC を検索</tspan></text>
<rect x="20" y="108" width="370" height="28" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="30" y="126.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">get_abstract</tspan></text>
<text x="380" y="126.5" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>書誌と抄録</tspan></text>
<rect x="20" y="142" width="370" height="28" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="30" y="160.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">find_sentences</tspan></text>
<text x="380" y="160.5" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>全文から語を含む文</tspan></text>
<rect x="10" y="192" width="390" height="65.35" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="212.55" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Europe PMC が答えないとき</tspan></text>
<text x="22" y="230.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>書誌・抄録は PubMed、全文は PMC（NCBI BioC）</tspan></text>
<text x="22" y="247.07500000000002" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>結果の </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">note</tspan><tspan> に落ちたサービスを書く</tspan></text>
<rect x="10" y="269.35" width="390" height="82.025" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="289.90000000000003" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>通信の守り（ワーカーの照合と共通）</tspan></text>
<text x="22" y="307.75" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>15 秒で打ち切り、1・2・4 秒おいて 3 回まで再試行</tspan></text>
<text x="22" y="324.425" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>3 回続けて失敗したホストは 5 分休む</tspan></text>
<text x="22" y="341.1" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>呼び出しの間隔を空ける（200 ms・350 ms）</tspan></text>
<rect x="10" y="363.375" width="390" height="82.025" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="383.925" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>エージェントが書くもの</tspan></text>
<text x="22" y="401.775" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">references.json</tspan><tspan>（DOI・PMID・文献の種類）</tspan></text>
<text x="22" y="418.45" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">connections.json</tspan><tspan>（論文の原文の引用）</tspan></text>
<text x="22" y="435.125" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>調査モードでは </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">research.json</tspan></text>
<text x="462" y="26" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>検証：ワーカー</tspan></text>
<rect x="460" y="36" width="390" height="82.025" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="472" y="56.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>文献の照合 → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">reference_check.json</tspan></text>
<text x="472" y="74.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>DOI → Crossref（なければ doi.org）</tspan></text>
<text x="472" y="91.075" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>PMID → PubMed</tspan></text>
<text x="472" y="107.75" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>第一著者・年（±1）・題名が合うか</tspan></text>
<rect x="460" y="132.025" width="390" height="82.025" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="472" y="152.57500000000002" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>引用文の照合 → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">quote_check.json</tspan></text>
<text x="472" y="170.425" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>全文：Europe PMC → PMC（BioC）</tspan></text>
<text x="472" y="187.10000000000002" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>全文がなければ抄録（4 つのサービス）</tspan></text>
<text x="472" y="203.77500000000003" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>空白・記号・引用記号を無視、類似度 0.9 以上</tspan></text>
<rect x="460" y="228.05" width="390" height="82.025" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="472" y="248.60000000000002" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>エージェントに返すもの</tspan></text>
<text x="472" y="266.45" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">mismatch</tspan><tspan>・</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">not_found</tspan><tspan> は修正依頼</tspan></text>
<text x="472" y="283.125" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>（一番近い箇所と論文のリンクを添える）</tspan></text>
<text x="472" y="299.8" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>照合できないだけなら止めない（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">unverified</tspan><tspan>）</tspan></text>
