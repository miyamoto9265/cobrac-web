<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 281" width="860" height="281" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Spot 中断からの再開：v0.18.1 まで と v0.18.2 から</title>
<desc id="d">v0.18.1 までは、作業場所の保存がフェーズの受理・質問・完了・失敗のときだけだった。Fargate Spot の中断（2 分前に SIGTERM）では何もせずに終わるので、前回の保存からの作業が消えた。ハートビートが 15 分古くなってから、15 分ごとの janitor が再試行するので、再開は中断の 15〜30 分後だった。v0.18.2 からは、ターンの途中でも 5 分ごとに作業場所とスレッドを S3 に保存し、SIGTERM を受けたらすぐ保存して（猶予 120 秒）ハートビートを古い時刻にする。janitor は 5 分ごとに動くので、約 5 分後に保存した続きから再開する。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="281" fill="#ffffff"/>
<rect x="10" y="10" width="840" height="30" rx="8" fill="#f59e0b"/><text x="430" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v0.18.1 まで</tspan></text>
<rect x="10" y="52" width="192" height="68.8" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="73.55" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>ターン実行中</tspan></text>
<text x="22" y="91.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>保存はフェーズの受理・</tspan></text>
<text x="22" y="109.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>質問・完了・失敗のときだけ</tspan></text>
<path d="M202 86.4 L226 86.4" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="226" y="52" width="192" height="68.8" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="238" y="73.55" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>Spot 中断</tspan></text>
<text x="238" y="91.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>SIGTERM では何もしない</tspan></text>
<text x="238" y="109.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>前回の保存からの作業が消える</tspan></text>
<path d="M418 86.4 L442 86.4" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="442" y="52" width="192" height="68.8" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="454" y="73.55" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>検出を待つ</tspan></text>
<text x="454" y="91.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ハートビートが 15 分古くなる</tspan></text>
<text x="454" y="109.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>janitor は 15 分ごと</tspan></text>
<path d="M634 86.4 L658 86.4" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="658" y="52" width="192" height="68.8" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="670" y="73.55" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>再開</tspan></text>
<text x="670" y="91.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>中断から 15〜30 分後</tspan></text>
<text x="670" y="109.35000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>前回の保存から</tspan></text>
<rect x="10" y="140.8" width="840" height="30" rx="8" fill="#3b82f6"/><text x="430" y="160.8" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v0.18.2 から</tspan></text>
<rect x="10" y="182.8" width="192" height="86.19999999999999" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="213.05" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>ターン実行中</tspan></text>
<text x="22" y="231.45" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>5 分ごとに作業場所と</tspan></text>
<text x="22" y="248.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>スレッドを S3 に保存</tspan></text>
<path d="M202 225.9 L226 225.9" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="226" y="182.8" width="192" height="86.19999999999999" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="238" y="204.35000000000002" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Spot 中断</tspan></text>
<text x="238" y="222.75" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>SIGTERM ですぐ保存</tspan></text>
<text x="238" y="240.15" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>（猶予 120 秒）</tspan></text>
<text x="238" y="257.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ハートビートを古い時刻に</tspan></text>
<path d="M418 225.9 L442 225.9" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="442" y="182.8" width="192" height="86.19999999999999" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="454" y="213.05" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>janitor</tspan></text>
<text x="454" y="231.45" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>5 分ごとに動き</tspan></text>
<text x="454" y="248.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>次の実行で再試行</tspan></text>
<path d="M634 225.9 L658 225.9" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="658" y="182.8" width="192" height="86.19999999999999" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="670" y="213.05" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>再開</tspan></text>
<text x="670" y="231.45" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>中断から約 5 分後</tspan></text>
<text x="670" y="248.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>保存した続きから</tspan></text>
</svg>
