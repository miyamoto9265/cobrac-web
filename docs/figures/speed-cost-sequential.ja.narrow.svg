<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 518" width="430" height="518" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">並列化で縮められる範囲が小さい理由</title>
<desc id="d">調査 → HCD → FRG → 調整ターン → CSV・xlsx は、前の段の結果を入力にするので直列でしか進められない。HCD は UC・接続・Collection が互いに依存する 1 つのグラフ、FRG は 1 本の木で、分けて作ると結合のときに整合をとり直す必要がある。並列にできるのは調査ステップの証拠集めくらいだが、OpenAI の組織の TPM 上限は gpt-6-luna で 20 万トークン/分で、1 本のスレッドだけで平均 14〜17 万トークン/分を使っているため、2 本目を足すとすぐ上限に当たる。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="518" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="30" rx="8" fill="#64748b"/><text x="215" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>前の段の結果を入力にするので、段は直列</tspan></text>
<rect x="10" y="54" width="200" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="74.85" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>調査</tspan></text>
<text x="22" y="93.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>候補の投射</tspan></text>
<path d="M250 79 L216 79" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow-f59e0b)"/>
<text x="256" y="76" font-size="11.5" font-weight="400" fill="#92400e" text-anchor="start"><tspan>並列にできる余地は</tspan></text>
<text x="256" y="92" font-size="11.5" font-weight="400" fill="#92400e" text-anchor="start"><tspan>ここだけ（数分）</tspan></text>
<path d="M110 104 L110 120" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="120" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="140.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>HCD</tspan></text>
<text x="22" y="159.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>1 つのグラフ</tspan></text>
<path d="M110 170 L110 186" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="186" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="206.85000000000002" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>FRG</tspan></text>
<text x="22" y="225.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>1 本の木</tspan></text>
<path d="M110 236 L110 252" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="252" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="272.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>調整ターン</tspan></text>
<text x="22" y="291.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>両方を見て直す</tspan></text>
<path d="M110 302 L110 318" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="318" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="338.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>CSV・xlsx</tspan></text>
<text x="22" y="357.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>0.1 分</tspan></text>
<text x="10" y="398" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>OpenAI の組織の TPM 上限（gpt-6-luna）</tspan></text>
<rect x="10" y="412" width="410" height="30" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
<rect x="10" y="412" width="239.2" height="30" rx="4" fill="#4338ca"/>
<rect x="249.2" y="412" width="51.3" height="30" fill="#4338ca" opacity="0.45"/>
<text x="20" y="432" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start"><tspan>1 本のスレッドの平均 14〜17 万/分</tspan></text>
<line x1="351.7" y1="404" x2="351.7" y2="452" stroke="#ef4444" stroke-width="2.5"/>
<text x="351.6666666666667" y="468" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>上限 20 万/分</tspan></text>
<text x="10" y="468" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start"><tspan>0k</tspan></text>
<text x="180.83333333333334" y="468" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle"><tspan>100k</tspan></text>
<text x="420" y="486" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>トークン/分</tspan></text>
<text x="10" y="508" font-size="12.5" font-weight="600" fill="#991b1b" text-anchor="start"><tspan>2 本目を足すと上限に当たる</tspan></text>
</svg>
