<text x="274" y="506.8" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>decide from evidence</tspan></text>
<text x="274" y="522.75" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>what to fix; record</tspan></text>
<text x="274" y="538.7" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>it under revisions</tspan></text>
