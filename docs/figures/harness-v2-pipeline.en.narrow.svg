<text x="246" y="487" font-size="9.5" font-weight="400" fill="#991b1b" text-anchor="middle"><tspan>X1–3, X8</tspan></text>
<path d="M288 458 L288 335 L230 335" fill="none" stroke="#8b5cf6" stroke-width="2.2" marker-end="url(#arrow-8b5cf6)"/>
<text x="296" y="357" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>split or add UCs</tspan></text>
<text x="296" y="372" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="start"><tspan>(coarse unit →</tspan></text>
<text x="296" y="387" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="start"><tspan>Collection)</tspan></text>
<circle cx="412" cy="460" r="11" fill="#10b981"/><text x="412" y="464.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<path d="M361 562 L361 575 L230 575" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="369" y="580" font-size="11" font-weight="400" fill="#475569" text-anchor="start"><tspan>re-check,</tspan></text>
<text x="369" y="594" font-size="11" font-weight="400" fill="#475569" text-anchor="start"><tspan>then CSV</tspan></text>
<circle cx="222" cy="466" r="11" fill="#10b981"/><text x="222" y="470.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
<circle cx="22" cy="716" r="11" fill="#10b981"/><text x="22" y="720.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<rect x="40.0" y="704" width="199.4" height="23.5" rx="11.75" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="50" y="719.89" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="start"><tspan>A changed HCD is validated again</tspan></text>
<text x="50" y="744" font-size="11" font-weight="400" fill="#065f46" text-anchor="start"><tspan>(</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">phase_baseline.json</tspan><tspan>)</tspan></text>
<text x="12" y="764" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>① back-edge to the HCD, adjustment turn</tspan></text>
<text x="12" y="784" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>② HCD re-validated in later steps</tspan></text>
<text x="12" y="804" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>③ HCD–FRG consistency checks</tspan></text>
</svg>
