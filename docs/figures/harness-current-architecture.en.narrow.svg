<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1298" width="430" height="1298" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC harness v2: the actors and what they hand over</title>
<desc id="d">Purple marks the LLM, blue a program, green files, and white people, external services and storage. The API (Lambda) records the user's input as a job, and the dispatcher (Lambda) starts a worker in a Fargate container for each job. The worker is a program with no LLM: it sends requests to the CoBRAC agent (an OpenAI model run by Codex) and receives the JSON that ends each turn. The work itself is handed over as files in the workspace: the agent writes the data JSON and the explanatory markdown, and the worker checks them and writes the check results, CSVs, xlsx files and graphs. The model reasons outside the container, on the OpenAI API. The agent searches literature databases through lit and SABRA candidates through RCS. Results and the conversation are stored in S3, and progress reaches the screen through DynamoDB and WebSocket. The agent decides whether to ask a question; the worker saves, stops and resumes.</desc>
