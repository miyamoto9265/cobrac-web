<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1152" width="430" height="1152" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC harness v2: overall architecture</title>
<desc id="d">The Web UI and API turn user input into jobs. An SQS dispatcher starts a Fargate worker. The worker sends phase specifications and fixes to the Codex agent, which uses RCS and lit to edit JSON and explanatory text. The worker validates the files and generates CSVs, two xlsx formats and graphs in code, storing the results in S3. For a question it saves the workspace and conversation and exits; after the user answers, a new worker restores them and resumes.</desc>
