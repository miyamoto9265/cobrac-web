<path d="M350 206 L400 206" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="700" y="100.20000000000002" width="150" height="81.69999999999999" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="775" y="128.55" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>Model wait</tspan></text>
<text x="775" y="147.35" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>41.7 → 24.2 min</tspan></text>
<text x="775" y="164.75" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>total 48.6 → 31.0 min</tspan></text>
<path d="M660 84.8 L680 84.8 L680 141.05 L700 141.05" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
