<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 552" width="860" height="552" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">ハーネス v1.1 のデータの流れ（アプリ 0.8 以降）</title>
<desc id="d">エージェントは RCS MCP サーバーで脳領域を SABRA 単位に照会し、references.json、uc.json、connections.json、frg.json の JSON と、meta.json、report.md、decision_log.md を書く。ワーカーは全 RCS 呼び出しを rcs_mcp_calls.jsonl に残し、schemas/ に書き出したのと同じ JSON Schema で検査し、相互参照と UC 命名規則を検査する（HOMBA アンカーの略称はワーカーが RCS の get_homba_term で確認）。問題は JSON ポインタ付きの修正依頼として最大 3 回返す。CSV 5 本は buildCsvs が JSON から作り、予備フェーズはない。画面では xlsx、グラフ、レポート、判断ログを見られる。</desc>
