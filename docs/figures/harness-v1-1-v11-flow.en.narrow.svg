<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1112" width="430" height="1112" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Data flow of harness v1.1 (app 0.8 and later)</title>
<desc id="d">The agent looks up brain regions as SABRA units in the RCS MCP server and writes the JSON files references.json, uc.json, connections.json and frg.json, plus meta.json, report.md and decision_log.md. The worker keeps every RCS call in rcs_mcp_calls.jsonl, checks the files against the same JSON Schemas it wrote to schemas/, and checks cross-references and the UC naming rules (it confirms the abbreviation of HOMBA anchors with RCS get_homba_term). Problems go back as fix prompts with JSON pointers, up to 3 times. buildCsvs generates the five CSVs from the JSON; there is no fallback phase. The app shows the xlsx, graphs, report and decision log.</desc>
