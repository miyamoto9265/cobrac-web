<text x="10" y="242" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>The paper's name goes to Notation (e.g. </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">visual word form area</tspan><tspan>)</tspan></text>
<text x="560" y="24" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>One reference per row</tspan></text>
