<text x="382" y="190" font-size="17" font-weight="700" fill="#065f46" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="15.6" fill="#1e293b">&gt;</tspan></text>
