<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 656" width="860" height="656" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">言語野の試行：回単位の UC を分けると FRG の分解が変わった</title>
<desc id="d">非語の音読（左の読字ネットワーク）の HCD と FRG。前（0.11.0、ufwwj0jg-1）は ROI 内の UC が FuG@L、IPL@L、IFG@L（回全体、BNAG）と A22c@L の 4 つで、FRG は TLF の下に正書法と頭頂の分析、音韻の組み立ての 2 つの GN だけ、深さ 2。X9 は 3 件。後（戻り道の試行、ufwwj0jg-5）は、FuG@L を A37lv@L と A20rv@L、IPL@L を角回と縁上回、IFG@L を弁蓋部と三角部に分け、元の回は Collection になった（UC 7、Collection 3）。FRG は腹側の正書法分析、側頭頭頂の音韻分析（その下に下頭頂の音韻支援）、前頭の音韻出力の 4 つの GN、深さ 3 になった。X9 は 0 件。</desc>
