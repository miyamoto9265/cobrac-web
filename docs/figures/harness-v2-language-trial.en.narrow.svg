<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1016" width="430" height="1016" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Language-area trial: splitting gyrus-level UCs changed the FRG</title>
<desc id="d">HCD and FRG of nonword reading (left reading network). Before (0.11.0, ufwwj0jg-1) the ROI had 4 UCs, FuG@L, IPL@L, IFG@L (whole gyri, BNAG) and A22c@L, and the FRG had two GNs under the TLF, orthographic–parietal analysis and phonological assembly, depth 2; X9 found 3. After (back-edge trial, ufwwj0jg-5) FuG@L was split into A37lv@L and A20rv@L, IPL@L into angular and supramarginal gyrus, IFG@L into pars opercularis and triangularis, and the gyri became Collections (7 UCs, 3 Collections). The FRG has four GNs, ventral orthographic analysis, temporo-parietal phonological analysis (with inferior parietal phonological support below it) and frontal phonological output, depth 3; X9 found 0.</desc>
