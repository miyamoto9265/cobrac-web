<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1264" width="430" height="1264" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC harness v2: generation and validation</title>
<desc id="d">Optional research, on by default, precedes HCD generation and validation. The worker extracts bottom-up candidates from the HCD in code; the agent combines them with the top-down decomposition of the TLF to build the FRG. Cross-checks X1–X9 are recorded. Findings of X1, X2, X3 or X8 trigger at most one adjustment turn per run: change the FRG, split or add HCD UCs, or retain a mismatch with its reason. Changed HCD and FRG files are revalidated before code generates five CSVs, two xlsx formats and graphs. Hypotheses require explicit permission and checks of scope, allowed claims and share limits.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="1264" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="30" rx="8" fill="#1e3a8a"/><text x="215" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>CoBRAC harness v2: generation and validation</tspan></text>
<rect x="10" y="58" width="410" height="80" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="85.14999999999999" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>Hypotheses require explicit permission</tspan></text>
<text x="22" y="103.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Check scope, allowed claims and share limits</tspan></text>
<text x="22" y="120.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Record the basis and FRG dependencies</tspan></text>
<rect x="10" y="162" width="410" height="82" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="190.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>1. Research (optional, on by default)</tspan></text>
<text x="22" y="208.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Literature search → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">research.json</tspan></text>
<text x="22" y="225.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Coverage checks and fixes</tspan></text>
<path d="M215 244 L215 272" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="272" width="410" height="86" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="302.15000000000003" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>2. HCD: build circuits and connections</tspan></text>
<text x="22" y="320.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>UCs, Collections, connections, references</tspan></text>
<text x="22" y="337.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Check schema, naming, BRA, references and quotes</tspan></text>
<path d="M215 358 L215 386" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="386" width="410" height="82" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="414.15000000000003" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Code extracts candidates from the HCD</tspan></text>
<text x="22" y="432.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">frg_candidates.json</tspan></text>
<text x="22" y="449.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Motifs, pathways and boundaries for the FRG</tspan></text>
<path d="M215 468 L215 496" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="496" width="410" height="86" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="526.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>3. FRG: map functions to circuits</tspan></text>
<text x="22" y="544.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>TLF decomposition × bottom-up candidates</tspan></text>
<text x="22" y="561.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Check GNs, Interfaces and function details</tspan></text>
<path d="M215 582 L215 610" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="610" width="410" height="86" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="640.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>4. Cross-checks X1–X9</tspan></text>
<text x="22" y="658.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Record in </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">cross_check.json</tspan></text>
<text x="22" y="675.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>X1, X2, X3 or X8 → request an adjustment</tspan></text>
<path d="M215 696 L215 724" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="38" y="724" width="382" height="116" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="50" y="760.4499999999999" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Adjustment (at most once per run)</tspan></text>
<text x="50" y="778.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Change the FRG / split or add HCD UCs</tspan></text>
<text x="50" y="796.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Or record why a mismatch is retained</tspan></text>
<text x="50" y="813.65" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Then run the validation and fix loop</tspan></text>
<path d="M10 653 L3 653 L3 856 L215 856" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-3b82f6)"/>
<path d="M215 840 L215 876" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="10" y="876" width="410" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="902.15" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Record why the HCD / FRG changed</tspan></text>
<text x="22" y="920.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">decision_log.md</tspan></text>
<text x="22" y="937.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Under </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">## HCD-FRG revisions</tspan></text>
<path d="M215 954 L215 982" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="982" width="410" height="98" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="22" y="1009.4499999999999" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>5. Revalidate changed HCD / FRG files</tspan></text>
<text x="22" y="1027.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Detect changes with </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">phase_baseline.json</tspan></text>
<text x="22" y="1045.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Rerun earlier checks in later phases</tspan></text>
<text x="22" y="1062.65" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Recheck hypothesis scope, shares and dependencies</tspan></text>
<path d="M215 1080 L215 1108" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="10" y="1108" width="410" height="98" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="22" y="1135.45" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>6. Code generates the results</tspan></text>
<text x="22" y="1153.8500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Five CSVs → two xlsx formats</tspan></text>
<text x="22" y="1171.2500000000002" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CoBRAC-v1-1 / Template-v2-2</tspan></text>
<text x="22" y="1188.6500000000003" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>HCD / FRG graphs from the same data</tspan></text>
<text x="10" y="1233" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>Each stage: edit → validate → fix as needed</tspan></text>
<text x="10" y="1251" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>Questions save and pause; answers resume the work</tspan></text>
</svg>
