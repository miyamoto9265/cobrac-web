<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 236" width="860" height="236" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Canon は UC Descriptor をキーにする</title>
<desc id="d">プロジェクトの uc.json は Circuit ID と UC Descriptor を持つ。push や PR のとき、Canon は記述子を正規化した形（現在の形、mol の値の並べ替え、小文字化）をキーにして回路を照合し、エントリに Circuit ID、正式名、Uniform / Collection、Sub-Circuits を持つ。照合の結果、Circuit ID と記述子が 1 対 1 でない（C4）、同じ記述子で Uniform と Collection が違う（C1）、Uniform の回路と同じアンカーのより細かい回路が並ぶ（C3）、正式名が違う（C6）ときは、生成時には修正ターンでエージェントに戻す。旧い形のキーと ID は現在の形にして比べる。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="236" fill="#ffffff"/>
<rect x="20" y="10" width="226" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="133" y="32.150000000000006" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>プロジェクトの </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">uc.json</tspan></text>
<text x="133" y="50.550000000000004" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Circuit ID </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">A4ul(left)</tspan></text>
<text x="133" y="67.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>記述子 </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">BNA:57-58/side:left</tspan></text>
<path d="M246 45 L317 45" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="281.5" y="38" font-size="11" font-weight="400" fill="#475569" text-anchor="middle"><tspan>push / PR</tspan></text>
<rect x="317" y="10" width="226" height="70" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="430" y="32.150000000000006" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>Canon のキー</tspan></text>
<text x="430" y="50.550000000000004" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>正規化した記述子</tspan></text>
<text x="430" y="67.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">bna:57-58/side:left</tspan></text>
<path d="M543 45 L614 45" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="578.5" y="38" font-size="11" font-weight="400" fill="#475569" text-anchor="middle"><tspan>正規化</tspan></text>
<rect x="614" y="10" width="226" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="727" y="32.150000000000006" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>Canon のエントリ</tspan></text>
<text x="727" y="50.550000000000004" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Circuit ID・正式名</tspan></text>
<text x="727" y="67.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Uniform/Collection・Sub-Circuits</tspan></text>
<text x="20" y="114" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>キーで照合して見る主な衝突（生成時は修正ターンで戻す）</tspan></text>
<rect x="20" y="124" width="196" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="118" y="144.15" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>C4</tspan></text>
<text x="118" y="162.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Circuit ID と記述子が</tspan></text>
<text x="118" y="179.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>1 対 1 でない</tspan></text>
<rect x="228" y="124" width="196" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="326" y="144.15" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>C1</tspan></text>
<text x="326" y="162.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>同じ記述子で Uniform と</tspan></text>
<text x="326" y="179.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Collection が違う</tspan></text>
<rect x="436" y="124" width="196" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="534" y="144.15" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>C3</tspan></text>
<text x="534" y="162.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Uniform の回路の隣に</tspan></text>
<text x="534" y="179.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>より細かい回路がある</tspan></text>
<rect x="644" y="124" width="196" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="742" y="144.15" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>C6</tspan></text>
<text x="742" y="162.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>正式名（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">names</tspan><tspan> の</tspan></text>
<text x="742" y="179.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>先頭）が違う</tspan></text>
<text x="430" y="216" font-size="12" font-weight="400" fill="#475569" text-anchor="middle"><tspan>旧い形（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">bna:29</tspan><tspan>、</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">A44d@L</tspan><tspan>）は現在の形にして比べ、違いは PR に改名として出る</tspan></text>
</svg>
