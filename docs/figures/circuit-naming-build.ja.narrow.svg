<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 690" width="430" height="690" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">UC Descriptor から Circuit ID を組み立てる</title>
<desc id="d">UC Descriptor BNA:57-58/lay:L5/cell:pt/out:HOMBA:AA30565/side:left から Circuit ID A4ul(L5.pt.out-Sp.left) を組み立てる。アンカー BNA:57-58 は正式略称 A4ul になり、ファセットの値は記述子の順に括弧の中へ . で区切って並ぶ。層 L5 と細胞クラス pt は語のまま、投射先 out:HOMBA:AA30565（脊髄）は out-Sp、左右 side:left は最後の項目 left になる。ファセットの軸は part、lay、cell、nt、mol、in、out、resp、side の 9 本で、この順に並べ、空の軸は書かない。</desc>
