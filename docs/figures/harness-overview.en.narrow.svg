<text x="38" y="236.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex agent (one long turn)</tspan></text>
<text x="38" y="256.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Reads 4 Japanese instruction files (13.9k)</tspan></text>
