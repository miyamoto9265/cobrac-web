<text x="38" y="610.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Literature research and interpretation</tspan></text>
<text x="38" y="629.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Fixes only the listed problems</tspan></text>
