<rect x="26" y="416" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="438.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Worker (CoBRAC harness)</tspan></text>
<text x="38" y="458.52500000000003" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Runs one phase at a time (HCD → FRG → CSV)</tspan></text>
<text x="38" y="477.37500000000006" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Checks the files with code after every turn</tspan></text>
<text x="38" y="496.2250000000001" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Builds the CSVs, xlsx and graphs itself</tspan></text>
<path d="M80 510 L80 566" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
