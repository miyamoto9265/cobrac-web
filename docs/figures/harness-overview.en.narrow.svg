<rect x="10" y="34" width="410" height="12" fill="#f59e0b"/>
<text x="215" y="33" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v0: the agent reads the manual and runs everything</tspan></text>
<rect x="26" y="62" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="84.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Worker</tspan></text>
<text x="38" y="104.52499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>A single instruction:</tspan></text>
<text x="38" y="123.37499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>&quot;Read </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">instruction_0.md</tspan><tspan> and follow it&quot;</tspan></text>
<text x="38" y="142.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>&quot;Done&quot; = the CSV files exist</tspan></text>
