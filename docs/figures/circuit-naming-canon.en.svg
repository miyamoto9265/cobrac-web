<text x="430" y="216" font-size="12" font-weight="400" fill="#475569" text-anchor="middle"><tspan>Older forms (</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">bna:29</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">A44d@L</tspan><tspan>) are compared in the current form; the difference shows as a rename in the PR</tspan></text>
