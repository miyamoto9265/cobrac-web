<text x="326" y="162.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>same descriptor, Uniform</tspan></text>
<text x="326" y="179.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>vs Collection</tspan></text>
<rect x="436" y="124" width="196" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="534" y="144.15" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>C3</tspan></text>
<text x="534" y="162.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>a finer circuit next to</tspan></text>
<text x="534" y="179.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>a Uniform circuit</tspan></text>
<rect x="644" y="124" width="196" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
