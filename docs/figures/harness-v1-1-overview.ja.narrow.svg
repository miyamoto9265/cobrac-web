<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 714" width="430" height="714" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">ハーネス v1 と v1.1 の比較：データの形式と UC の名前</title>
<desc id="d">v1 ではエージェントがデータを md の表で書き、ワーカーがパースし直して検査した。Circuit ID は自由な名前で、CSV が作れないとエージェントに手書きさせ、画面で見られるのは xlsx とグラフだけだった。v1.1 ではエージェントがデータを JSON で書き、UC を RCS で SABRA 単位に固定して命名する。ワーカーは JSON Schema と UC 命名規則で検査し、CSV・xlsx・グラフを常にコードで作り、レポートと判断ログも画面で閲覧できる。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="714" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="10" y="10" width="410" height="36" rx="12" fill="#3b82f6"/>
<rect x="10" y="34" width="410" height="12" fill="#3b82f6"/>
<text x="215" y="33" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v1（アプリ 0.5〜0.6）：データは md の表</tspan></text>
<rect x="26" y="62" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="84.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>ワーカー</tspan></text>
<text x="38" y="104.52499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>md の表をパースし直して検査</tspan></text>
<text x="38" y="123.37499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CSV が作れないとエージェントに手書きさせる</tspan></text>
<text x="38" y="142.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>画面で見られるのは xlsx とグラフだけ</tspan></text>
<path d="M80 156 L80 212" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="92" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>フェーズ仕様</tspan></text>
<text x="92" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>問題一覧</tspan></text>
<path d="M350 212 L350 156" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="338" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>md の表</tspan></text>
<text x="338" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">\|</tspan><tspan>・</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">&lt;br&gt;</tspan><tspan> で表現）</tspan></text>
<rect x="26" y="214" width="378" height="92" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="236.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex エージェント</tspan></text>
<text x="38" y="256.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>データを md の表で書く（HCD 6・FRG 5 本）</tspan></text>
<text x="38" y="275.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Circuit ID は自由な名前</tspan></text>
<text x="38" y="294.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>検証メモや中間の分解表も書く</tspan></text>
<rect x="105.0" y="314" width="219.9" height="24" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="115.03999999999999" y="330.32" font-size="12" font-weight="600" fill="#991b1b" text-anchor="start"><tspan>データ形式：md の表（パース頼み）</tspan></text>
<rect x="10" y="364" width="410" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="10" y="364" width="410" height="36" rx="12" fill="#0d9488"/>
<rect x="10" y="388" width="410" height="12" fill="#0d9488"/>
<text x="215" y="387" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v1.1（アプリ 0.8〜）：データは JSON</tspan></text>
<rect x="26" y="416" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="438.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>ワーカー（CoBRAC ハーネス v1.1）</tspan></text>
<text x="38" y="458.52500000000003" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>JSON Schema と UC 命名規則で検査</tspan></text>
<text x="38" y="477.37500000000006" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CSV・xlsx・グラフは常にコードで作る</tspan></text>
<text x="38" y="496.2250000000001" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>レポートと判断ログも画面で閲覧できる</tspan></text>
<path d="M80 510 L80 566" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="92" y="534" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>フェーズ仕様</tspan></text>
<text x="92" y="550" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>JSON ポインタ付きの問題</tspan></text>
<path d="M350 566 L350 510" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="338" y="534" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>JSON ファイル 4 本</tspan></text>
<text x="338" y="550" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>+ md 2 本</tspan></text>
<rect x="26" y="568" width="378" height="92" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="590.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex エージェント + RCS</tspan></text>
<text x="38" y="610.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>データを JSON で書く（HCD 3・FRG 1 本）</tspan></text>
<text x="38" y="629.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>UC を RCS で SABRA 単位に固定して命名</tspan></text>
<text x="38" y="648.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>md は report.md と decision_log.md だけ</tspan></text>
<rect x="99.2" y="668" width="231.7" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="109.16" y="684.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>データ形式：JSON（スキーマで保証）</tspan></text>
</svg>
