<text x="215" y="31.4" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>The FRG step ends</tspan></text>
<text x="215" y="48.5" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>accepted, or with warnings left</tspan></text>
<path d="M215 60 L215 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="82" width="410" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="215" y="104.4" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>Consistency check (</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">checkCross</tspan><tspan>)</tspan></text>
<text x="215" y="121.5" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>kept in </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">cross_check.json</tspan><tspan>; counts in the chat</tspan></text>
<path d="M215 134 L215 156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="156" width="250" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="135" y="180.375" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle"><tspan>Any X1, X2, X3 or X8?</tspan></text>
<rect x="280" y="142" width="140" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="159.36249999999998" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>Record only</tspan></text>
<text x="350" y="175.7125" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>X4–X6 and X9</tspan></text>
<text x="350" y="190.9375" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>are counted;</tspan></text>
<text x="350" y="206.1625" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>on to the CSVs</tspan></text>
