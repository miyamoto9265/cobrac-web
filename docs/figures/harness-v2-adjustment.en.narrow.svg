<text x="143" y="213" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>yes</tspan></text>
<rect x="10" y="222" width="410" height="64" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="215" y="242.425" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>Adjustment turn (once per run)</tspan></text>
<text x="215" y="259.52500000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>the findings and what each check means</tspan></text>
<text x="215" y="275.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>“decide from evidence which side to fix”</tspan></text>
<path d="M215 286 L215 294 L20 294" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
<rect x="34" y="300" width="386" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="319.45" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Fix the FRG</tspan></text>
<text x="46" y="336.55" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>decompose the TLF more finely</tspan></text>
<text x="46" y="352.5" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>correct GN interfaces</tspan></text>
<text x="46" y="368.45" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>(also when evidence is missing)</tspan></text>
<path d="M20 339 L34 339" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="34" y="388" width="386" height="78" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="46" y="407.45" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Back to HCD step 3</tspan></text>
<text x="46" y="424.55" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>split or add UCs</tspan></text>
<text x="46" y="440.5" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>the coarse unit → Collection</tspan></text>
<text x="46" y="456.45" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>new connections need references</tspan></text>
<path d="M20 427 L34 427" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="34" y="476" width="386" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="46" y="495.425" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Keep it</tspan></text>
<text x="46" y="512.525" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>write the difference and</tspan></text>
<text x="46" y="528.475" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>the reason as </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[kept]</tspan></text>
<path d="M20 507 L34 507" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<path d="M20 294 L20 507" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
<circle cx="412" cy="390" r="11" fill="#10b981"/><text x="412" y="394.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
