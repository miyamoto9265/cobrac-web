<text x="223" y="557" font-size="11" font-weight="400" fill="#92400e" text-anchor="start"><tspan>every choice is recorded</tspan></text>
<rect x="10" y="568" width="410" height="78" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
