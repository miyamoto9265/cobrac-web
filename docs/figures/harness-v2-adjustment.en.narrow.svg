<text x="215" y="604.5500000000001" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>one line per change in </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">decision_log.md</tspan></text>
