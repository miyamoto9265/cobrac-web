<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 522" width="430" height="522" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">BRA 形式の接続：sCID / rCID relation と 1 行 1 文献</title>
<desc id="d">接続の両端について、UC と論文が報告した回路の関係を relation で書き、論文上の名前を Notation 列に書く。&lt; は UC が論文の回路の一部（UC A37lv@L と論文の fusiform gyrus）、= は同じ（IFG@L と inferior frontal gyrus）、&gt; は UC が論文の細かい回路を含む（FuG@L と visual word form area）。v1.1 は relation がいつも = で、Notation は Circuit ID の写し、1 行に複数の文献を連結していた。v2 は 1 行 1 文献で、同じ送り手と受け手を文献ごとに繰り返し、それぞれに Taxon、計測法、引用文を書く。</desc>
