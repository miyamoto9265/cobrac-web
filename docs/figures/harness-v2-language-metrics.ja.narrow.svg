<title id="t">言語野の 3 つの実行の比較：v0、0.11.0、戻り道の試行</title>
<desc id="d">同じ ROI と TLF（非語の音読）の 3 つの実行。ROI 内の UC は v0 が 5、0.11.0 が 4、試行が 7。Collection は 0、0、3。接続の行は 17、14、21。文献は 19、17、21。照合済みの引用文は 0、14、21。FRG の GN は 8、2、4。FRG の深さは 3、2、3。X9 は v0 では測れず、0.11.0 が 3、試行が 0。付録 D の自動判定で違反したコードは v0 が 7、0.11.0 が 1、試行は測っていない。v0 の UC は自由な名前で、SABRA の単位に固定していない。</desc>
