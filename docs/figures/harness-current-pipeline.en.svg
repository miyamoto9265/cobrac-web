<text x="482" y="130.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Research check</tspan></text>
<text x="482" y="148.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Matches search log and coverage</tspan></text>
<text x="482" y="165.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">research_check.json</tspan></text>
