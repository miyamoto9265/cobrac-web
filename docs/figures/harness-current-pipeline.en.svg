<text x="768" y="546" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>No findings</tspan></text>
<rect x="10" y="562" width="380" height="74" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="586.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>4. Adjustment turn (if needed, once)</tspan></text>
<text x="22" y="604.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Changes FRG or HCD, or records why not</tspan></text>
<text x="22" y="621.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ revisions in </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">decision_log.md</tspan></text>
<rect x="470" y="562" width="380" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="482" y="586.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Revalidate changed files</tspan></text>
<text x="482" y="604.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Reruns earlier checks as well</tspan></text>
<text x="482" y="621.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">phase_baseline.json</tspan></text>
<path d="M390 588 L470 588" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
