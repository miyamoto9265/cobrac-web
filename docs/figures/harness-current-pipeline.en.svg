<rect x="10" y="676" width="380" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="708.8499999999999" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>No LLM takes part here</tspan></text>
<text x="22" y="727.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CSV problems return as JSON fixes</tspan></text>
<rect x="470" y="676" width="380" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="482" y="700.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>5. Generate and save the results</tspan></text>
<text x="482" y="718.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>JSON → 5 CSVs → 2 xlsx formats, graphs</tspan></text>
<text x="482" y="735.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ saved version </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">&lt;ProjectID&gt;@vN</tspan></text>
<text x="10" y="782" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>The agent can ask a question in any turn; the worker saves, stops, and resumes the same conversation.</tspan></text>
<text x="10" y="802" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>Hypotheses are allowed only when the user permits them; the worker checks their scope and share.</tspan></text>
</svg>
