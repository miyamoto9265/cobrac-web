<text x="482" y="358.15000000000003" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>FRG candidates</tspan></text>
<text x="482" y="376.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Pathways and motifs from HCD links</tspan></text>
<text x="482" y="393.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">frg_candidates.json</tspan></text>
<path d="M560 408 L560 428 L200 428 L200 448" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="380" y="424" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>Candidates go into the FRG request</tspan></text>
<rect x="10" y="448" width="380" height="74" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="472.15000000000003" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>3. FRG turn</tspan></text>
<text x="22" y="490.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Decomposes the TLF; maps candidates</tspan></text>
<text x="22" y="507.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">frg.json</tspan><tspan>, report mapping table</tspan></text>
