<text x="22" y="279.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">uc.json</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">connections.json</tspan><tspan>, …</tspan></text>
<rect x="470" y="220" width="380" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="482" y="244.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>HCD validation</tspan></text>
<text x="482" y="262.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Schema, naming, references, quotes</tspan></text>
<text x="482" y="279.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>→ </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">quote_check.json</tspan><tspan>, …</tspan></text>
<path d="M390 246 L470 246" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="430" y="240" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>Files</tspan></text>
<path d="M470 272 L390 272" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-3b82f6)"/>
