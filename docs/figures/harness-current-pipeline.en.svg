<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 826" width="860" height="826" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC harness v2: one BRA run and who writes what</title>
<desc id="d">The left column shows the turns of the CoBRAC agent (the LLM), the right column the processing of the worker (a program); arrows show the files and requests handed over. 1. In the research turn (on by default) the agent writes research.json, and the worker matches it against the search log and writes research_check.json. 2. In the HCD turn the agent writes uc.json, connections.json and the other HCD files, and the worker checks schema, naming, references and quotes. From the accepted HCD the worker computes pathways and motifs into frg_candidates.json and puts them in the FRG request. 3. In the FRG turn the agent writes frg.json and the mapping table of the report, and the worker checks GNs and interfaces and writes cross-checks X1–X9 to cross_check.json. 4. For X1, X2, X3 or X8 the worker sends one adjustment request; the agent changes the FRG or the HCD, or records why not, and the worker revalidates changed files. 5. The worker generates five CSVs, two xlsx formats and graphs from the JSON and saves a version; no LLM takes part. Whenever problems remain, the worker sends them back with a fix request.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
