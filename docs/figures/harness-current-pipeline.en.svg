<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 855" width="860" height="855" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC harness v2: generation and validation</title>
<desc id="d">Optional research, on by default, precedes HCD generation and validation. The worker extracts bottom-up candidates from the HCD in code; the agent combines them with the top-down decomposition of the TLF to build the FRG. Cross-checks X1–X9 are recorded. Findings of X1, X2, X3 or X8 trigger at most one adjustment turn per run: change the FRG, split or add HCD UCs, or retain a mismatch with its reason. Changed HCD and FRG files are revalidated before code generates five CSVs, two xlsx formats and graphs. Hypotheses require explicit permission and checks of scope, allowed claims and share limits.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="855" fill="#ffffff"/>
<rect x="10" y="10" width="840" height="30" rx="8" fill="#1e3a8a"/><text x="430" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>CoBRAC harness v2: generation and validation</tspan></text>
<rect x="20" y="58" width="390" height="86" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="88.14999999999999" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>1. Research (optional, on by default)</tspan></text>
<text x="32" y="106.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Literature search → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">research.json</tspan></text>
<text x="32" y="123.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Coverage checks and fixes</tspan></text>
<rect x="460" y="58" width="380" height="86" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="472" y="88.14999999999999" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>Hypotheses require explicit permission</tspan></text>
<text x="472" y="106.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Check scope, allowed claims and share limits</tspan></text>
<text x="472" y="123.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Record the basis and FRG dependencies</tspan></text>
<path d="M215 144 L215 180" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="20" y="180" width="390" height="90" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="32" y="212.15" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>2. HCD: build circuits and connections</tspan></text>
<text x="32" y="230.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>UCs, Collections, connections, references</tspan></text>
<text x="32" y="247.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Check schema, naming, BRA, references and quotes</tspan></text>
<path d="M410 225 L460 225" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="460" y="180" width="380" height="90" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="472" y="212.15" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Code extracts candidates from the HCD</tspan></text>
<text x="472" y="230.54999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">frg_candidates.json</tspan></text>
<text x="472" y="247.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Motifs, pathways and boundaries for the FRG</tspan></text>
<path d="M215 270 L215 306" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<path d="M650 270 L650 288 L390 288 L390 306" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="20" y="306" width="390" height="90" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="32" y="338.15000000000003" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>3. FRG: map functions to circuits</tspan></text>
<text x="32" y="356.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>TLF decomposition × bottom-up candidates</tspan></text>
<text x="32" y="373.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Check GNs, Interfaces and function details</tspan></text>
<rect x="460" y="306" width="380" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="472" y="338.15000000000003" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Record why the HCD / FRG changed</tspan></text>
<text x="472" y="356.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">decision_log.md</tspan></text>
<text x="472" y="373.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Under </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">## HCD-FRG revisions</tspan></text>
<path d="M215 396 L215 436" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="20" y="436" width="390" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="32" y="468.15000000000003" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>4. Cross-checks X1–X9</tspan></text>
<text x="32" y="486.55" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Record in </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">cross_check.json</tspan></text>
<text x="32" y="503.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>X1, X2, X3 or X8 → request an adjustment</tspan></text>
<path d="M410 481 L460 481" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow-f59e0b)"/>
<text x="435" y="463" font-size="10" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Findings</tspan></text>
<rect x="460" y="436" width="380" height="120" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="472" y="474.45" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Adjustment (at most once per run)</tspan></text>
<text x="472" y="492.84999999999997" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Change the FRG / split or add HCD UCs</tspan></text>
<text x="472" y="510.24999999999994" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Or record why a mismatch is retained</tspan></text>
<text x="472" y="527.65" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Then run the validation and fix loop</tspan></text>
<path d="M215 526 L215 606" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<path d="M650 556 L650 606" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="235" y="582" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>No adjustment / after adjustment</tspan></text>
<rect x="20" y="606" width="820" height="86" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="32" y="636.15" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>5. Revalidate changed HCD / FRG files</tspan></text>
<text x="32" y="654.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Detect changes with </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">phase_baseline.json</tspan><tspan>; rerun earlier checks in later phases</tspan></text>
<text x="32" y="671.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Recheck allowed hypotheses for scope, share limits and dependencies</tspan></text>
<path d="M430 692 L430 728" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="20" y="728" width="820" height="86" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="32" y="758.15" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>6. Code generates CSV → xlsx / graphs</tspan></text>
<text x="32" y="776.5500000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Five CSVs → CoBRAC-v1-1 / Template-v2-2 xlsx</tspan></text>
<text x="32" y="793.95" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>HCD / FRG graphs come from the same data</tspan></text>
<text x="10" y="843" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>Each stage: agent edits → worker validates → fixes as needed. Questions save and pause; answers resume the work.</tspan></text>
</svg>
