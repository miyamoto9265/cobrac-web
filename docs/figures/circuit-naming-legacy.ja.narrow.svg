<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 554" width="430" height="554" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">旧い形の読み替え（v0.17.0）</title>
<desc id="d">保存済みのデータは書き換えない。読むときに UC Descriptor は canonicalUcDescriptor で現在の形にする。BNA:57 は BNA:57-58/side:left、BNAG:FuG@L は BNAG:FuG/side:left、HOMBA:12261@R は HOMBA:12261/side:right になる。Circuit ID は modernCircuitId で現在の形にする。A4ul@L(L5,pt,out:Sp) は A4ul(L5.pt.out-Sp.left)、NAC(shell,DRD1+) は NAC(shell.DRD1+)、A9/46d@L(L3) は A9/46d(L3.left) になる。検証は次のフォローアップで現在の形への書き直しを求め、Canon は旧い形と新しい形を同じ回路・同じ ID として比べ、ビューアと CSV・xlsx は保存された ID をそのまま出す。</desc>
