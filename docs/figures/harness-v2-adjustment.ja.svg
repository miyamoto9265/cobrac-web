<text x="430" y="546.025" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>HCD が変わったら HCD の検証を全部やり直す</tspan></text>
<text x="430" y="564.625" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>命名・RCS・BRA の値・文献・引用文（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">phase_baseline.json</tspan><tspan> のハッシュで判定）</tspan></text>
<circle cx="724" cy="524" r="11" fill="#10b981"/><text x="724" y="528.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
