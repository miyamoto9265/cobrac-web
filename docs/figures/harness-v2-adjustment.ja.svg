<text x="430" y="49.625" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>受理でも、警告を残した場合でも</tspan></text>
<path d="M430 60 L430 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="230" y="82" width="400" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="430" y="104.025" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>整合チェック（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.4" fill="#1e293b">checkCross</tspan><tspan>）</tspan></text>
<text x="430" y="122.625" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>結果は </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">cross_check.json</tspan><tspan> とチャットの件数</tspan></text>
<path d="M430 134 L430 156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="230" y="156" width="400" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="430" y="180.725" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle"><tspan>X1・X2・X3・X8 がある？</tspan></text>
