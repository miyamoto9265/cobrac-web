<text x="666" y="181.725" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>記録だけ。調整の</tspan></text>
<text x="666" y="198.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>きっかけにするかは未定</tspan></text>
<path d="M430 196 L430 222" fill="none" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow-ef4444)"/>
<text x="438" y="213" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>ある</tspan></text>
<rect x="230" y="222" width="400" height="64" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="430" y="241.325" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>調整ターン（実行ごとに 1 回）</tspan></text>
<text x="430" y="259.925" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>所見の一覧と各検査の意味を渡す</tspan></text>
<text x="430" y="277.325" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>「どちらを直すかを証拠で決めよ」</tspan></text>
<path d="M430 286 L430 302 M145 302 L715 302" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
<path d="M145 302 L145 320" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="10" y="320" width="270" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="145" y="343.5375" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>FRG を直す</tspan></text>
<text x="145" y="361.3875" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>TLF の分解を細かくする</tspan></text>
<text x="145" y="378.0625" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>GN の Interface を直す</tspan></text>
<text x="145" y="394.7375" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>（証拠がないときもこちら）</tspan></text>
<path d="M430 302 L430 320" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="295" y="320" width="270" height="88" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="430" y="343.5375" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>HCD に戻る（手順 3）</tspan></text>
<text x="430" y="361.3875" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>UC を分ける・足す</tspan></text>
<text x="430" y="378.0625" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>粗い単位は Collection にする</tspan></text>
<text x="430" y="394.7375" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>新しい接続には文献と引用文</tspan></text>
<path d="M715 302 L715 320" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="580" y="320" width="270" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="715" y="351.875" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>直さない</tspan></text>
<text x="715" y="369.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>食い違いとその理由を</tspan></text>
<text x="715" y="386.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">[kept]</tspan><tspan> の行に書く</tspan></text>
<circle cx="559" cy="322" r="11" fill="#10b981"/><text x="559" y="326.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
