<text x="105" y="155.53750000000002" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>記録だけ</tspan></text>
<text x="105" y="173.38750000000002" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>X4〜X6・X9 は</tspan></text>
<text x="105" y="190.06250000000003" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>数えるだけ</tspan></text>
<text x="105" y="206.73750000000004" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>そのまま CSV へ</tspan></text>
