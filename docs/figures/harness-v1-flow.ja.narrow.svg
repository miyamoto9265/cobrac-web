<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1306" width="430" height="1306" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">v1 のアーキテクチャ：ワーカーがフェーズを進めて検証する</title>
<desc id="d">ワーカー（CoBRAC ハーネス）は作業場所を準備し AGENTS.md を置く。HCD フェーズではヘッダと phases/HCD.md をプロンプトにし、エージェントが HCD 6 本と meta.json を書くと checkHcd() で検査する。問題があれば問題一覧つきの修正依頼を送り（最大 3 回）、エージェントは指摘箇所だけを直す。受理されると FRG フェーズに進み、phases/FRG.md と checkFrg() で同様に進める。CSV フェーズはエージェントなしで buildCsvs() が md の表から CSV 5 本を作り、失敗したときだけフォールバックの phases/CSV.md でエージェントが CSV を書く。最後に csv_to_excel.py が .bra.xlsx を、buildGraphs() が HCD/FRG の JSON を作り S3 に置く。どのターンでも status が question なら状態を S3 に保存してタスクを止め、ユーザーの回答を待つ。</desc>
