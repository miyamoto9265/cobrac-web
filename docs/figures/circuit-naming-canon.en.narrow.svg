<text x="215" y="46.35" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Circuit ID </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">A4ul(left)</tspan></text>
<text x="215" y="63.025" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>descriptor </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">BNA:57-58/side:left</tspan></text>
<path d="M215 72 L215 98" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="225" y="89" font-size="11" font-weight="400" fill="#475569" text-anchor="start"><tspan>push / PR</tspan></text>
<rect x="10" y="98" width="410" height="62" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="215" y="116.7" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>Canon key</tspan></text>
<text x="215" y="134.35" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>normalized descriptor</tspan></text>
<text x="215" y="151.025" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">bna:57-58/side:left</tspan></text>
<path d="M215 160 L215 186" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="225" y="177" font-size="11" font-weight="400" fill="#475569" text-anchor="start"><tspan>match</tspan></text>
<rect x="10" y="186" width="410" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="215" y="204.7" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>Canon entry</tspan></text>
