<text x="109.5" y="330.90000000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Circuit ID and descriptor</tspan></text>
<text x="109.5" y="346.85" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>are not one-to-one</tspan></text>
<rect x="221" y="292" width="199" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="320.5" y="313.6" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>C1</tspan></text>
<text x="320.5" y="330.90000000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>same descriptor, Uniform</tspan></text>
<text x="320.5" y="346.85" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>vs Collection</tspan></text>
<rect x="10" y="368" width="199" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="109.5" y="389.6" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>C3</tspan></text>
<text x="109.5" y="406.90000000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>a finer circuit next to</tspan></text>
<text x="109.5" y="422.85" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>a Uniform circuit</tspan></text>
<rect x="221" y="368" width="199" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="320.5" y="389.6" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>C6</tspan></text>
<text x="320.5" y="406.90000000000003" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>different official name</tspan></text>
<text x="320.5" y="422.85" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>(first of </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">names</tspan><tspan>)</tspan></text>
<text x="10" y="460" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>Older forms (</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">bna:29</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">A44d@L</tspan><tspan>) are compared in the current form;</tspan></text>
<text x="10" y="478" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>the difference shows as a rename in the PR</tspan></text>
</svg>
