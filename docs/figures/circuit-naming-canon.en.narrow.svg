<text x="215" y="239.025" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Uniform/Collection, Sub-Circuits</tspan></text>
<text x="10" y="282" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>Main conflicts checked by the key (fixed in a fix turn)</tspan></text>
