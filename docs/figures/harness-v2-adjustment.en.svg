<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 648" width="860" height="648" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif" style="font-variant-ligatures:none">
<title id="t">The adjustment turn and the back-edge to the HCD</title>
<desc id="d">When the FRG step ends, the worker checks the consistency of HCD and FRG with checkCross and records it in cross_check.json. Without X1, X2, X3 or X8 it only records and goes on to the CSVs (X4–X6 and X9 are only counted). With them it sends one adjustment turn per run. From the evidence, the agent fixes the FRG (finer TLF decomposition, corrected GN interfaces), goes back to HCD step 3 (split or add UCs, the coarse unit becomes a Collection, new connections need references and quotes), or keeps the difference and says why, and writes one tagged line per change in the HCD-FRG revisions section of decision_log.md. If the HCD changed, the worker runs every HCD check again before building the CSVs and xlsx. X9 (granularity) does not trigger the adjustment yet.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
