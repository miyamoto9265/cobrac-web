<text x="430" y="49.625" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>accepted, or with warnings left</tspan></text>
<path d="M430 60 L430 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="230" y="82" width="400" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="430" y="104.025" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>Consistency check (</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.4" fill="#1e293b">checkCross</tspan><tspan>)</tspan></text>
<text x="430" y="122.625" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>kept in </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">cross_check.json</tspan><tspan>; counts in the chat</tspan></text>
<path d="M430 134 L430 156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="230" y="156" width="400" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="430" y="180.725" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle"><tspan>Any X1, X2, X3 or X8?</tspan></text>
<rect x="10" y="140" width="190" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="105" y="155.53750000000002" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>Record only</tspan></text>
<text x="105" y="173.38750000000002" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>X4–X6 and X9</tspan></text>
<text x="105" y="190.06250000000003" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>are counted;</tspan></text>
<text x="105" y="206.73750000000004" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>on to the CSVs</tspan></text>
<path d="M230 180 L200 180" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="215" y="167" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>no</tspan></text>
