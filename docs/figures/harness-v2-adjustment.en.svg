<text x="666" y="181.725" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>record only; whether it</tspan></text>
<text x="666" y="198.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>should trigger: open</tspan></text>
<path d="M430 196 L430 222" fill="none" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow-ef4444)"/>
<text x="438" y="213" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>yes</tspan></text>
<rect x="230" y="222" width="400" height="64" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="430" y="241.325" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>Adjustment turn (once per run)</tspan></text>
<text x="430" y="259.925" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>the findings and what each check means</tspan></text>
<text x="430" y="277.325" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>“decide from evidence which side to fix”</tspan></text>
<path d="M430 286 L430 302 M145 302 L715 302" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
<path d="M145 302 L145 320" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="10" y="320" width="270" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="145" y="343.5375" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>Fix the FRG</tspan></text>
<text x="145" y="361.3875" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>decompose the TLF more finely</tspan></text>
<text x="145" y="378.0625" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>correct GN interfaces</tspan></text>
<text x="145" y="394.7375" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>(also when evidence is missing)</tspan></text>
<path d="M430 302 L430 320" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="295" y="320" width="270" height="88" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="430" y="343.5375" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>Back to HCD step 3</tspan></text>
<text x="430" y="361.3875" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>split or add UCs</tspan></text>
<text x="430" y="378.0625" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>the coarse unit → Collection</tspan></text>
<text x="430" y="394.7375" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>new connections need references</tspan></text>
