<text x="715" y="369.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>write the difference and</tspan></text>
<text x="715" y="386.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>the reason as </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">[kept]</tspan></text>
<circle cx="559" cy="322" r="11" fill="#10b981"/><text x="559" y="326.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
