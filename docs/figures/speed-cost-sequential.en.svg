<text x="10" y="164" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Organisation's OpenAI TPM limit (gpt-6-luna)</tspan></text>
<rect x="10" y="178" width="840" height="30" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
<rect x="10" y="178" width="490.0" height="30" rx="4" fill="#4338ca"/>
<rect x="500.0" y="178" width="105.0" height="30" fill="#4338ca" opacity="0.45"/>
<text x="20" y="198" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start"><tspan>one thread: 140k–170k/min on average</tspan></text>
<line x1="710.0" y1="170" x2="710.0" y2="218" stroke="#ef4444" stroke-width="2.5"/>
<text x="710" y="234" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>limit 200k/min</tspan></text>
