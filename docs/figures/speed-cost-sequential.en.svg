<text x="360" y="234" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle"><tspan>100k</tspan></text>
<text x="850" y="252" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>tokens/min</tspan></text>
<text x="10" y="274" font-size="12.5" font-weight="600" fill="#991b1b" text-anchor="start"><tspan>a second thread hits the limit</tspan></text>
