<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 754" width="860" height="754" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC ハーネス v2：登場する主体と受け渡し</title>
<desc id="d">紫は LLM、青はプログラム、緑はファイル、白は人・外部サービス・保存先を表す。利用者の入力を API（Lambda）がジョブとして記録し、dispatcher（Lambda）がジョブごとに Fargate コンテナでワーカーを起動する。ワーカーは LLM を含まないプログラムで、CoBRAC エージェント（Codex が動かす OpenAI のモデル）に依頼文を送り、ターン終了の JSON を受け取る。作業の中身は作業場所のファイルで受け渡す。エージェントはデータ JSON と説明の md を書き、ワーカーはそれを検査して検査結果、CSV、xlsx、グラフを書く。推論はコンテナの外の OpenAI API で行われる。エージェントは lit で文献データベースを、RCS で SABRA の候補を調べる。成果物と会話は S3 に保存し、進捗は DynamoDB と WebSocket で画面に送る。質問するかどうかはエージェントが決め、保存・停止・再開はワーカーが行う。</desc>
