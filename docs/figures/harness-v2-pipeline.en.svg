<text x="510" y="342" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>if X1–X3</tspan></text>
<text x="510" y="357" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>or X8</tspan></text>
