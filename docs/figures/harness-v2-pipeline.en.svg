<text x="646" y="107.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>JSON in code</tspan></text>
<path d="M706 85 L730 85" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
