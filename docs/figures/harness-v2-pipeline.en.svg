<text x="50" y="470.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>A changed HCD is validated again (</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">phase_baseline.json</tspan><tspan>)</tspan></text>
<text x="12" y="494" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>① back-edge to the HCD, adjustment turn</tspan></text>
