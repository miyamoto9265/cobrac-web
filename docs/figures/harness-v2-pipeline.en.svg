<text x="214" y="90.72500000000001" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>8 steps</tspan></text>
<text x="214" y="107.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>check → accept</tspan></text>
