<text x="358" y="292.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>step 3 may go</tspan></text>
<text x="358" y="309.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>back to HCD</tspan></text>
<path d="M418 287 L442 287" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
