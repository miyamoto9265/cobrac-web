<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 604" width="430" height="604" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">回路の名前：プロジェクトごとの自由な名前から、SABRA に基づく記述子へ</title>
<desc id="d">0.7.0 より前は、プロジェクトごとにエージェントが自由な名前を付けていた。同じ側坐核 shell の DRD1 陽性集団でも、プロジェクト A は NAc_shell_D1、プロジェクト B は NACs-DRD1 と書くことがあり、名前から同じ集団かどうかを判定できず、アトラスとの対応もなかった。0.7.0 以降は、どのプロジェクトも RCS で SABRA の単位（アンカー）を引き、細かい性質をファセットとして足して UC Descriptor BNA:223-224/part:HOMBA:10341/mol:DRD1+ を作る。Circuit ID NAC(shell.DRD1+) はその人が読む別名で、記述子が同じなら同じ UC として扱える。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="604" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="30" rx="8" fill="#b45309"/><text x="215" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>0.7.0 より前：プロジェクトごとの自由な名前</tspan></text>
<rect x="10" y="52" width="410" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="75.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>プロジェクト A</tspan></text>
<text x="22" y="94.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">NAc_shell_D1</tspan><tspan>、</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">L-DLPFC</tspan><tspan>、</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">CA3-Pyr</tspan></text>
<rect x="10" y="118" width="410" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="141.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>プロジェクト B</tspan></text>
<text x="22" y="160.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">NACs-DRD1</tspan><tspan>、</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">DLPFC_L</tspan><tspan>、</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">CA3pyr</tspan></text>
<text x="416" y="190" font-size="11" font-weight="400" fill="#475569" text-anchor="end"><tspan>（名前は説明のための例）</tspan></text>
<rect x="10" y="200" width="410" height="54" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="215" y="222.85000000000002" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>同じ集団かどうかを名前から判定できない</tspan></text>
<text x="215" y="241.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>アトラスとの対応もない</tspan></text>
<rect x="10" y="282" width="410" height="30" rx="8" fill="#0d9488"/><text x="215" y="302" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>0.7.0 以降：SABRA のアンカー + ファセット</tspan></text>
<rect x="10" y="324" width="197" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="108.5" y="342.875" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>プロジェクト A</tspan></text>
<text x="108.5" y="360.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>RCS で SABRA の</tspan></text>
<text x="108.5" y="377.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>単位を引く</tspan></text>
<path d="M108.5 386 L185 416" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="223" y="324" width="197" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="321.5" y="342.875" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>プロジェクト B</tspan></text>
<text x="321.5" y="360.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>RCS で SABRA の</tspan></text>
<text x="321.5" y="377.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>単位を引く</tspan></text>
<path d="M321.5 386 L245 416" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="10" y="418" width="410" height="56" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="215" y="441.85" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>UC Descriptor（機械のキー）</tspan></text>
<text x="215" y="460.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">BNA:223-224/part:HOMBA:10341/mol:DRD1+</tspan></text>
<path d="M215 474 L215 498" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<rect x="10" y="500" width="410" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="215" y="523.4875" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>Circuit ID（人が読む別名）</tspan></text>
<text x="215" y="542.4375" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">NAC(shell.DRD1+)</tspan></text>
<rect x="69.3" y="566" width="291.4" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="79.28" y="582.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>記述子が同じなら、どのプロジェクトでも同じ UC</tspan></text>
</svg>
