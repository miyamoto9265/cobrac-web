<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 714" width="430" height="714" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">v0 と v1 の比較：誰がワークフローを進めるか</title>
<desc id="d">v0 ではワーカーが instruction_0.md を読めと指示するだけで、Codex エージェントが日本語の指示書 4 本を読み、完了を自分で判断し、英訳して CSV を手で書いた。完了の判定は CSV ファイルがあるかだけ。v1 ではワーカーがフェーズを 1 つずつ進め、英語のフェーズ仕様を渡し、ターンごとにファイルをコードで検査して問題一覧を返し、CSV・xlsx・グラフをコードで作る。エージェントは文献調査と科学的な解釈に集中する。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="714" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="10" y="10" width="410" height="36" rx="12" fill="#f59e0b"/>
<rect x="10" y="34" width="410" height="12" fill="#f59e0b"/>
<text x="215" y="33" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v0：エージェントが手順書を読み、全部を自分で回す</tspan></text>
<rect x="26" y="62" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="84.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>ワーカー</tspan></text>
<text x="38" y="104.52499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>指示は 1 つだけ：</tspan></text>
<text x="38" y="123.37499999999999" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>「</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">instruction_0.md</tspan><tspan> を読んで従って」</tspan></text>
<text x="38" y="142.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>完了の判定は「CSV があるか」だけ</tspan></text>
<path d="M80 156 L80 212" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="92" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>「読んで従え」</tspan></text>
<text x="92" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>（問題一覧なし）</tspan></text>
<path d="M350 212 L350 156" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="338" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>文字列マーカー</tspan></text>
<text x="338" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">[STEP_COMPLETE]</tspan></text>
<rect x="26" y="214" width="378" height="92" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="236.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex エージェント（長い 1 ターン）</tspan></text>
<text x="38" y="256.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>日本語の指示書 4 本（13.9k）を順に読む</tspan></text>
<text x="38" y="275.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>完了を自分で判断し </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">[STEP_COMPLETE]</tspan></text>
<text x="38" y="294.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>全部を英訳して CSV 5 本を手で書く</tspan></text>
<rect x="163.0" y="314" width="104.0" height="24" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="173" y="330.32" font-size="12" font-weight="600" fill="#991b1b" text-anchor="start"><tspan>品質検査：なし</tspan></text>
<rect x="10" y="364" width="410" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="10" y="364" width="410" height="36" rx="12" fill="#3b82f6"/>
<rect x="10" y="388" width="410" height="12" fill="#3b82f6"/>
<text x="215" y="387" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v1：ワーカーがフェーズを進めて検証する</tspan></text>
<rect x="26" y="416" width="378" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="438.625" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>ワーカー（CoBRAC ハーネス）</tspan></text>
<text x="38" y="458.52500000000003" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>フェーズを 1 つずつ進める（HCD → FRG → CSV）</tspan></text>
<text x="38" y="477.37500000000006" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ターンごとにファイルをコードで検査</tspan></text>
<text x="38" y="496.2250000000001" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>CSV・xlsx・グラフをコードで作る</tspan></text>
<path d="M80 510 L80 566" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="92" y="534" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>英語のフェーズ仕様</tspan></text>
<text x="92" y="550" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>1 本ずつ／問題一覧</tspan></text>
<path d="M350 566 L350 510" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="338" y="534" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan>構造化出力</tspan></text>
<text x="338" y="550" font-size="12" font-weight="400" fill="#475569" text-anchor="end"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">{status, …}</tspan></text>
<rect x="26" y="568" width="378" height="92" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="38" y="590.625" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex エージェント</tspan></text>
<text x="38" y="610.525" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>文献調査と科学的な解釈に集中</tspan></text>
<text x="38" y="629.375" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>指摘された箇所だけを直す</tspan></text>
<text x="38" y="648.225" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>ターンの終わりに JSON を返す</tspan></text>
<rect x="99.4" y="668" width="231.2" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="109.40000000000002" y="684.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>品質検査：列・ID・参照・FRG の制約</tspan></text>
