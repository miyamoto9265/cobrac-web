<path d="M715 320 L147 320" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="282.1" y="301" width="295.8" height="16" fill="#ffffff"/><text x="430" y="312" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>4 JSON that ends the turn: status, message, question</tspan></text>
<rect x="248.0" y="327.5" width="364.1" height="15.5" fill="#ffffff"/><text x="430" y="338" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>done means the agent has finished its work, not that the work passed</tspan></text>
<rect x="20" y="360" width="250" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
