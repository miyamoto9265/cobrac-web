<text x="32" y="405.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Reread the files and judge</tspan></text>
<path d="M428 391 L270 391" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow-10b981)"/>
<text x="349" y="383" font-size="11" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>5 Reads</tspan></text>
<rect x="305" y="446" width="250" height="62" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="317" y="472.85" font-size="13" font-weight="700" fill="#065f46" text-anchor="start"><tspan>Check results (by the worker)</tspan></text>
<text x="317" y="491.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">quote_check.json</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">cross_check.json</tspan></text>
<path d="M270 410 L430 410 L430 446" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<text x="438" y="432" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start"><tspan>Writes</tspan></text>
<path d="M145 422 L145 536" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="20" y="536" width="250" height="96" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="32" y="562.4499999999999" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>6 Decide what next (code)</tspan></text>
<text x="32" y="580.85" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Problems → fix request, to 1</tspan></text>
<text x="32" y="598.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Passed → next phase, to 1</tspan></text>
<text x="32" y="615.65" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>question → save and stop</tspan></text>
<path d="M20 584 L8 584 L8 161 L20 161" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-3b82f6)"/>
<text x="10" y="666" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>Only the request and the end JSON travel as messages; all work is handed over as files.</tspan></text>
<text x="10" y="686" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>The worker's code decides whether to move on, not the agent's report.</tspan></text>
