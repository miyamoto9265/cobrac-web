<text x="430" y="97.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Files in the project folder</tspan></text>
<rect x="590" y="54" width="250" height="58" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="715" y="78.85" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>CoBRAC agent</tspan></text>
<text x="715" y="97.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>LLM (Codex + an OpenAI model)</tspan></text>
<rect x="20" y="130" width="250" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="32" y="156.85000000000002" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>1 Build the request</tspan></text>
<text x="32" y="175.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>Spec, problems, candidates</tspan></text>
