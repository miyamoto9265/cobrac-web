<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 702" width="860" height="702" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC harness v2: what passes in one turn</title>
<desc id="d">What happens in one turn between the worker (a program), the workspace (files) and the CoBRAC agent (the LLM). 1. The worker builds a request from the phase specification, the list of problems and the candidates, and sends it as a conversation message. 2. The agent reasons and uses lit, RCS, web search and the shell. 3. The agent edits the data JSON and markdown files in the workspace. 4. The agent returns the JSON that ends the turn (status, message, question); done means it has finished its work, not that the work passed. 5. The worker rereads the files, runs the validators and writes the check-result JSON. 6. The worker's code decides what comes next: a fix request or the next phase's request goes back to step 1, and a question saves the state and stops.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
