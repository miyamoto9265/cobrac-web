<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 776" width="430" height="776" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">v0 のアーキテクチャ：エージェントが手順書を読み、全部を自分で回す</title>
<desc id="d">ワーカーは「instruction_0.md を読んで従ってください」とだけ送る。Codex エージェントは長い 1 ターンの中で instruction_0.md、instruction_1_HCD.md、instruction_2_FRG.md、instruction_3_csv.md を順に読み、HCD ファイル 8 本、FRG ファイル 5 本、CSV 5 本を書き、フェーズごとに [STEP_COMPLETE] マーカーを出す。文脈上の指示は 1.4k、6.1k、11.5k、13.9k トークンと積み上がる。ターンが終わるとワーカーは CSV があるかだけを確認し、なければ同じ内容で「続けて」と催促し（最大 3 回）、あれば csv_to_excel.py とグラフ生成に進む。</desc>
