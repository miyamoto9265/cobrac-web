<text x="34" y="452.8" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">instruction_3_csv.md</tspan><tspan> を読む（日本語 2.4k）</tspan></text>
<text x="34" y="470.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>└ md を読み直して英訳し、CSV 5 本を手で書く</tspan></text>
<circle cx="404" cy="432" r="11" fill="#ef4444"/><text x="404" y="436.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
