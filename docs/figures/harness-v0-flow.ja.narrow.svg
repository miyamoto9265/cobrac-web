<rect width="430" height="776" fill="#ffffff"/>
<text x="12" y="26" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>ワーカー</tspan></text>
<rect x="10" y="34" width="410" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
