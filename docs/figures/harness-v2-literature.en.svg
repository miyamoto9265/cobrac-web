<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 457.4" width="860" height="457.4" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Literature flow: lit tools during generation, checks by the worker</title>
<desc id="d">During generation the agent searches papers and takes sentences from abstracts and full texts with the lit MCP server: search_pubmed, search_europepmc, get_abstract and find_sentences. When Europe PMC does not answer, the record and abstract come from PubMed and the full text from PMC (NCBI BioC), and the result notes which service failed. Requests time out after 15 s, are retried up to 3 times after 1, 2 and 4 s, a host that fails 3 times in a row is skipped for 5 minutes, and calls are spaced. The agent writes references.json and connections.json (verbatim quotes), and research.json in research mode. The worker looks up DOIs in Crossref (or doi.org) and PMIDs in PubMed, checks first author, year and title (reference_check.json), and compares each quote with the full text (Europe PMC, PMC BioC) or abstract (quote_check.json). mismatch and not_found go back as fix prompts with the closest passage and a link; a paper that cannot be checked (unverified) never stops the run.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="457.4" fill="#ffffff"/>
<rect x="10" y="10" width="390" height="170" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="22" y="30" font-size="12.5" font-weight="700" fill="#8b5cf6" text-anchor="start"><tspan>During generation: the agent's </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">lit</tspan><tspan> tools</tspan></text>
<rect x="20" y="40" width="370" height="28" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="30" y="58.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">search_pubmed</tspan></text>
<text x="380" y="58.5" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>search PubMed</tspan></text>
<rect x="20" y="74" width="370" height="28" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="30" y="92.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">search_europepmc</tspan></text>
<text x="380" y="92.5" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>search Europe PMC</tspan></text>
<rect x="20" y="108" width="370" height="28" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="30" y="126.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">get_abstract</tspan></text>
<text x="380" y="126.5" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>record and abstract</tspan></text>
<rect x="20" y="142" width="370" height="28" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="30" y="160.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">find_sentences</tspan></text>
<text x="380" y="160.5" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>full-text sentences</tspan></text>
<rect x="10" y="192" width="390" height="65.35" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="212.55" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>When Europe PMC does not answer</tspan></text>
<text x="22" y="230.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>record, abstract from PubMed; full text from PMC</tspan></text>
<text x="22" y="247.07500000000002" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>(NCBI BioC); </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">note</tspan><tspan> names the failed service</tspan></text>
<rect x="10" y="269.35" width="390" height="82.025" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="289.90000000000003" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Request guards (shared with the checks)</tspan></text>
<text x="22" y="307.75" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>15 s timeout, up to 3 retries after 1, 2, 4 s</tspan></text>
<text x="22" y="324.425" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>a host failing 3 times in a row rests 5 min</tspan></text>
<text x="22" y="341.1" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>calls are spaced (200 ms, 350 ms)</tspan></text>
<rect x="10" y="363.375" width="390" height="82.025" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="22" y="383.925" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>What the agent writes</tspan></text>
<text x="22" y="401.775" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">references.json</tspan><tspan> (DOI, PMID, literature type)</tspan></text>
<text x="22" y="418.45" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">connections.json</tspan><tspan> (verbatim quotes)</tspan></text>
<text x="22" y="435.125" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">research.json</tspan><tspan> in research mode</tspan></text>
<text x="462" y="26" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Checks: the worker</tspan></text>
<rect x="460" y="36" width="390" height="82.025" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="472" y="56.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>References → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">reference_check.json</tspan></text>
<text x="472" y="74.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>DOI → Crossref (else doi.org)</tspan></text>
<text x="472" y="91.075" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>PMID → PubMed</tspan></text>
<text x="472" y="107.75" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>first author, year (±1), title must match</tspan></text>
<rect x="460" y="132.025" width="390" height="82.025" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="472" y="152.57500000000002" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Quotes → </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="12.0" fill="#1e293b">quote_check.json</tspan></text>
<text x="472" y="170.425" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>full text: Europe PMC → PMC (BioC)</tspan></text>
<text x="472" y="187.10000000000002" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>else the abstract (four services)</tspan></text>
<text x="472" y="203.77500000000003" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>spacing, punctuation ignored; similarity ≥ 0.9</tspan></text>
<rect x="460" y="228.05" width="390" height="82.025" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="472" y="248.60000000000002" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start"><tspan>What goes back to the agent</tspan></text>
<text x="472" y="266.45" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">mismatch</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">not_found</tspan><tspan>: fix prompt</tspan></text>
<text x="472" y="283.125" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>(with the closest passage and a link)</tspan></text>
<text x="472" y="299.8" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>cannot check: never blocks (</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">unverified</tspan><tspan>)</tspan></text>
