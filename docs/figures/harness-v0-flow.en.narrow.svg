<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 776" width="430" height="776" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">v0 architecture: the agent reads the manual and runs everything</title>
<desc id="d">The worker only sends &quot;Read instruction_0.md and follow it&quot;. In one long turn the Codex agent reads instruction_0.md, instruction_1_HCD.md, instruction_2_FRG.md and instruction_3_csv.md in order, writes 8 HCD files, 5 FRG files and 5 CSVs, and prints a [STEP_COMPLETE] marker after each phase. Instructions in the context pile up to 1.4k, 6.1k, 11.5k and 13.9k tokens. When the turn ends the worker only checks whether CSV files exist: if not, it sends the same &quot;continue&quot; nudge (max 3); if so, it runs csv_to_excel.py and builds the graphs.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="776" fill="#ffffff"/>
<text x="12" y="26" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start"><tspan>Worker</tspan></text>
<rect x="10" y="34" width="410" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="215" y="54.625" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>&quot;Read </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">instruction_0.md</tspan></text>
<text x="215" y="72.75" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>and follow it&quot;</tspan></text>
<path d="M215 84 L215 110" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-3b82f6)"/>
<rect x="10" y="110" width="410" height="414" rx="10" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="22" y="131" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start"><tspan>Codex agent (one long turn)</tspan></text>
<rect x="22" y="140" width="386" height="40" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="34" y="164.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>read </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">instruction_0.md</tspan><tspan> (JA, 1.4k tokens)</tspan></text>
<path d="M44 180 L44 224" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="404" y="203" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="end"><tspan>in context 1.4k</tspan></text>
<rect x="22" y="224" width="386" height="58" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="34" y="248.79999999999998" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>read </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">instruction_1_HCD.md</tspan><tspan> (JA, 4.8k)</tspan></text>
<text x="34" y="266.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>└ write 8 HCD files (incl. explainer + Mermaid)</tspan></text>
<path d="M44 282 L44 326" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="62.0" y="290" width="135.4" height="23" rx="11.5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text x="72" y="305.46" font-size="11" font-weight="600" fill="#92400e" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[STEP_COMPLETE] HCD</tspan></text>
<circle cx="209.36800000000005" cy="301" r="11" fill="#ef4444"/><text x="209.36800000000005" y="305.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<text x="404" y="305" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="end"><tspan>in context 6.1k</tspan></text>
<rect x="22" y="326" width="386" height="58" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="34" y="350.8" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>read </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">instruction_2_FRG.md</tspan><tspan> (JA, 5.3k)</tspan></text>
<text x="34" y="368.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>└ write 5 FRG files (tables + Mermaid)</tspan></text>
<path d="M44 384 L44 428" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<rect x="62.0" y="392" width="135.4" height="23" rx="11.5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text x="72" y="407.46" font-size="11" font-weight="600" fill="#92400e" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[STEP_COMPLETE] FRG</tspan></text>
<text x="404" y="407" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="end"><tspan>in context 11.5k</tspan></text>
<rect x="22" y="428" width="386" height="58" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="34" y="452.8" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>read </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">instruction_3_csv.md</tspan><tspan> (JA, 2.4k)</tspan></text>
<text x="34" y="470.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>└ re-read, translate, write 5 CSVs by hand</tspan></text>
<circle cx="404" cy="432" r="11" fill="#ef4444"/><text x="404" y="436.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
<rect x="62.0" y="494" width="135.4" height="23" rx="11.5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text x="72" y="509.46" font-size="11" font-weight="600" fill="#92400e" text-anchor="start"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.1" fill="#1e293b">[STEP_COMPLETE] CSV</tspan></text>
<text x="404" y="509" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="end"><tspan>in context 13.9k</tspan></text>
<circle cx="408" cy="126" r="11" fill="#ef4444"/><text x="408" y="130.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>4</tspan></text>
<path d="M112 524 L112 562" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="122" y="546" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>turn ends</tspan></text>
<text x="418" y="548" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="end"><tspan>Worker</tspan></text>
<path d="M112 562 L204 604 L112 646 L20 604 Z" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="112" y="601" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>CSV files</tspan></text>
<text x="112" y="618" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>present?</tspan></text>
<circle cx="28" cy="568" r="11" fill="#ef4444"/><text x="28" y="572.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<rect x="236" y="576" width="184" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="328" y="599.8000000000001" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>&quot;continue&quot; nudge</tspan></text>
<text x="328" y="617.2" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>(max 3, same prompt)</tspan></text>
<path d="M204 604 L236 604" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow-f59e0b)"/>
<text x="210" y="596" font-size="12" font-weight="600" fill="#92400e" text-anchor="start"><tspan>no</tspan></text>
<path d="M328 576 L328 524" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-f59e0b)"/>
<path d="M112 646 L112 674" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="120" y="664" font-size="12" font-weight="600" fill="#475569" text-anchor="start"><tspan>yes</tspan></text>
<rect x="10" y="674" width="240" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="130" y="698.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">csv_to_excel.py</tspan><tspan> → graphs</tspan></text>
<text x="10" y="742" font-size="12" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>① content not checked</tspan></text>
<text x="211" y="742" font-size="12" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>② progress via text markers</tspan></text>
<text x="10" y="762" font-size="12" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>③ CSV = manual translation</tspan></text>
<text x="211" y="762" font-size="12" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>④ all instructions stay in context</tspan></text>
</svg>
