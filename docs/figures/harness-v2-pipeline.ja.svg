<text x="204" y="377" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="end"><tspan>UC を分ける・足す</tspan></text>
<text x="204" y="392" font-size="11.5" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>（粗い単位は Collection）</tspan></text>
<circle cx="302" cy="380" r="11" fill="#10b981"/><text x="302" y="384.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<path d="M562 407 L646 407 L646 320" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<text x="654" y="425" font-size="11" font-weight="400" fill="#475569" text-anchor="start"><tspan>再検証して</tspan></text>
<text x="654" y="439" font-size="11" font-weight="400" fill="#475569" text-anchor="start"><tspan>CSV へ</tspan></text>
<circle cx="556" cy="256" r="11" fill="#10b981"/><text x="556" y="260.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
<circle cx="22" cy="466" r="11" fill="#10b981"/><text x="22" y="470.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<rect x="40.0" y="454" width="396.2" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="50" y="470.32" font-size="12" font-weight="600" fill="#065f46" text-anchor="start"><tspan>HCD が変わったら HCD の検証をやり直す（</tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.0" fill="#1e293b">phase_baseline.json</tspan><tspan>）</tspan></text>
<text x="12" y="494" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>① HCD への戻り道と調整ターン</tspan></text>
<text x="203.44" y="494" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>② 後段での HCD の再検証</tspan></text>
<text x="362.48" y="494" font-size="12" font-weight="400" fill="#065f46" text-anchor="start"><tspan>③ HCD↔FRG 整合チェック</tspan></text>
