<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 506" width="860" height="506" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">パイプラインの比較：v1.1 と v2</title>
<desc id="d">v1.1 は HCD → FRG → CSV → xlsx を 1 回ずつ進む。受理したフェーズには戻らず、FRG の段で HCD を直しても検査されず、HCD と FRG の整合は見ない。v2 は任意の調査ステップ（既定でオン）から始まり、HCD → FRG の後に整合チェック X1〜X9 を記録する。X1〜X3・X8 があれば調整ターンを 1 回送り、エージェントは FRG を直すか、HCD の手順 3 に戻って UC を分ける・足す。HCD が変わったら HCD の検証をやり直してから CSV に進み、xlsx は CoBRAC-v1-1 と Template-v2-2 の 2 種類を作る。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="860" height="506" fill="#ffffff"/>
<rect x="10" y="10" width="840" height="30" rx="8" fill="#0d9488"/><text x="430" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v1.1（アプリ 0.8）：1 回ずつ前へ進む</tspan></text>
<text x="70" y="90" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" font-style="italic"><tspan>調査なし</tspan></text>
<rect x="154" y="52" width="120" height="66" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="214" y="72.875" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>HCD</tspan></text>
<text x="214" y="90.72500000000001" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>8 手順</tspan></text>
<text x="214" y="107.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>検証 → 受理</tspan></text>
<path d="M274 85 L298 85" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="298" y="52" width="120" height="66" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="358" y="72.875" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>FRG</tspan></text>
<text x="358" y="90.72500000000001" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>6 手順</tspan></text>
<text x="358" y="107.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>検証 → 受理</tspan></text>
<path d="M418 85 L586 85" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="586" y="52" width="120" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="646" y="72.875" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>CSV</tspan></text>
<text x="646" y="90.72500000000001" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>JSON から</tspan></text>
<text x="646" y="107.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>コードで生成</tspan></text>
<path d="M706 85 L730 85" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="730" y="52" width="120" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="790" y="72.875" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>xlsx</tspan></text>
<text x="790" y="90.72500000000001" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>CoBRAC-v1-0</tspan></text>
<text x="790" y="107.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>1 種類</tspan></text>
<text x="502" y="77" font-size="11" font-weight="400" fill="#991b1b" text-anchor="middle"><tspan>受理したら戻らない</tspan></text>
<circle cx="502" cy="101" r="11" fill="#ef4444"/><text x="502" y="105.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<circle cx="412" cy="54" r="11" fill="#ef4444"/><text x="412" y="58.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<circle cx="700" cy="54" r="11" fill="#ef4444"/><text x="700" y="58.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
<circle cx="22" cy="136" r="11" fill="#ef4444"/><text x="22" y="140.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<text x="40" y="141" font-size="12" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>FRG は「完成した HCD」から作る。HCD に戻る道がない</tspan></text>
<circle cx="22" cy="158" r="11" fill="#ef4444"/><text x="22" y="162.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<text x="40" y="163" font-size="12" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>FRG の段で HCD を直しても、その変更は検査されない</tspan></text>
<circle cx="22" cy="180" r="11" fill="#ef4444"/><text x="22" y="184.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
<text x="40" y="185" font-size="12" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>HCD と FRG が合っているかは見ない</tspan></text>
<rect x="10" y="212" width="840" height="30" rx="8" fill="#4338ca"/><text x="430" y="232" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>v2（アプリ 0.13〜）：戻り道と整合チェック</tspan></text>
<rect x="10" y="254" width="120" height="66" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="70" y="274.875" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>調査ステップ</tspan></text>
<text x="70" y="292.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>既定でオン</tspan></text>
<text x="70" y="309.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="10.6" fill="#1e293b">research.json</tspan></text>
<path d="M130 287 L154 287" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="154" y="254" width="120" height="66" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="214" y="274.875" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>HCD</tspan></text>
<text x="214" y="292.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>BRA の値</tspan></text>
<text x="214" y="309.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>文献・引用文</tspan></text>
<path d="M274 287 L298 287" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="298" y="254" width="120" height="66" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="358" y="274.875" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>FRG</tspan></text>
<text x="358" y="292.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>手順 3 に</tspan></text>
<text x="358" y="309.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>HCD への戻り道</tspan></text>
<path d="M418 287 L442 287" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="442" y="254" width="120" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="502" y="274.875" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>整合チェック</tspan></text>
<text x="502" y="292.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>X1〜X9</tspan></text>
<text x="502" y="309.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>（記録と調整）</tspan></text>
<path d="M562 287 L586 287" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="586" y="254" width="120" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="646" y="274.875" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>CSV</tspan></text>
<text x="646" y="292.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>JSON から</tspan></text>
<text x="646" y="309.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>コードで生成</tspan></text>
<path d="M706 287 L730 287" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="730" y="254" width="120" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="790" y="274.875" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle"><tspan>xlsx × 2</tspan></text>
<text x="790" y="292.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>CoBRAC-v1-1</tspan></text>
<text x="790" y="309.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Template-v2-2</tspan></text>
<rect x="298" y="378" width="264" height="58" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="430" y="394.875" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>調整ターン（1 回）</tspan></text>
<text x="430" y="412.72499999999997" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>どちらを直すかを証拠で決め、</tspan></text>
<text x="430" y="429.4" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>revisions 節に記録する</tspan></text>
<path d="M502 320 L502 378" fill="none" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow-ef4444)"/>
<text x="510" y="342" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>X1〜X3・X8</tspan></text>
<text x="510" y="357" font-size="11" font-weight="400" fill="#991b1b" text-anchor="start"><tspan>があれば</tspan></text>
<path d="M358 378 L358 320" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-8b5cf6)"/>
<text x="350" y="350" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="end"><tspan>FRG を直す</tspan></text>
