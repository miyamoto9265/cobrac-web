<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 540" width="430" height="540" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Why parallel work can save little</title>
<desc id="d">Research → HCD → FRG → adjustment turn → CSV / xlsx can only run in order, because each step takes the previous one's result as input. The HCD is one graph whose UCs, connections and Collections depend on each other, and the FRG is one tree; built in parts, they would have to be reconciled again when joined. Only the evidence gathering of the research step could run in parallel, but the organisation's OpenAI limit for gpt-6-luna is 200k tokens per minute and one thread already uses 140k–170k per minute on average, so a second thread soon hits the limit.</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="430" height="540" fill="#ffffff"/>
<rect x="10" y="10" width="410" height="30" rx="8" fill="#64748b"/><text x="215" y="30" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>Each step needs the previous result: in order</tspan></text>
<rect x="10" y="54" width="200" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="22" y="74.85" font-size="13" font-weight="700" fill="#92400e" text-anchor="start"><tspan>Research</tspan></text>
<text x="22" y="93.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>candidate search</tspan></text>
<path d="M250 79 L216 79" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow-f59e0b)"/>
<text x="256" y="76" font-size="11.5" font-weight="400" fill="#92400e" text-anchor="start"><tspan>only room for parallel</tspan></text>
<text x="256" y="92" font-size="11.5" font-weight="400" fill="#92400e" text-anchor="start"><tspan>work (a few minutes)</tspan></text>
<path d="M110 104 L110 120" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="120" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="140.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>HCD</tspan></text>
<text x="22" y="159.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>one graph</tspan></text>
<path d="M110 170 L110 186" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="186" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="206.85000000000002" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>FRG</tspan></text>
<text x="22" y="225.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>one tree</tspan></text>
<path d="M110 236 L110 252" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="252" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="272.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Adjustment</tspan></text>
<text x="22" y="291.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>revises both</tspan></text>
<path d="M110 302 L110 318" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="10" y="318" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="22" y="338.85" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>CSV / xlsx</tspan></text>
<text x="22" y="357.25" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>0.1 min</tspan></text>
<text x="10" y="398" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start"><tspan>Organisation's OpenAI TPM limit (gpt-6-luna)</tspan></text>
<rect x="10" y="412" width="410" height="30" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
<rect x="10" y="412" width="239.2" height="30" rx="4" fill="#4338ca"/>
<rect x="249.2" y="412" width="51.3" height="30" fill="#4338ca" opacity="0.45"/>
<line x1="351.7" y1="404" x2="351.7" y2="452" stroke="#ef4444" stroke-width="2.5"/>
<text x="351.6666666666667" y="468" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle"><tspan>limit 200k/min</tspan></text>
<text x="10" y="468" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start"><tspan>0k</tspan></text>
<text x="180.83333333333334" y="468" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle"><tspan>100k</tspan></text>
<text x="420" y="486" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="end"><tspan>tokens/min</tspan></text>
<rect x="10" y="496" width="16" height="14" rx="3" fill="#4338ca"/>
<text x="32" y="508" font-size="12" font-weight="400" fill="#475569" text-anchor="start"><tspan>one thread: 140k–170k/min on average</tspan></text>
<text x="10" y="530" font-size="12.5" font-weight="600" fill="#991b1b" text-anchor="start"><tspan>a second thread hits the limit</tspan></text>
</svg>
