<rect x="720" y="81" width="10.7" height="14" rx="3" fill="#f59e0b"/>
<text x="830" y="111" font-size="12" font-weight="600" fill="#92400e" text-anchor="end"><tspan>1.4k</tspan></text>
<rect x="324" y="150" width="366" height="60" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="336" y="175.625" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>read </tspan><tspan font-family="'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,'Noto Sans Mono CJK JP',monospace" font-size="11.5" fill="#1e293b">instruction_1_HCD.md</tspan><tspan> (JA, 4.8k)</tspan></text>
<text x="336" y="193.75" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>└ write 8 HCD files (incl. explainer + Mermaid)</tspan></text>
