<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">プロジェクト画面の構成</title>
<desc id="d">上のヘッダーに名前・状態・ROI と TLF・モデル・利用量、停止とリトライ、BRA xlsx のダウンロード、公開、Canon への push、削除が並び、その下に進み具合が出ます。成果物はタブ（HCD、FRG、表データ、レポート、判断ログ、解説記事）で切り替えます。右のエージェント欄に作業のログ、質問、入力欄があります。スマホではエージェント欄はボタンで開きます。</desc>
