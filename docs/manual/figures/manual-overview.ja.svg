<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">CoBRAC Agents の流れ：ROI と TLF から BRA データまで</title>
<desc id="d">ROI（対象領域）と TLF（トップレベル機能）を入れて実行すると、エージェントが調査（調査モードのとき）、HCD と FRG の往復、CSV、BRA xlsx の順に作ります。各ステップが終わるとプロジェクト画面に成果物が出ます。質問が来たらエージェント欄で答え、完了後は追加の指示で直せます。</desc>
<defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="arrow-3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="arrow-8b5cf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker><marker id="arrow-10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="arrow-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="arrow-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
<rect width="880" height="250" fill="#ffffff"/>
<rect x="23" y="24" width="146" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="96" y="52.775000000000006" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>入力</tspan></text>
<text x="96" y="72.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>ROI・TLF</tspan></text>
<text x="96" y="90.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>参考資料（任意）</tspan></text>
<path d="M172 66 L192 66" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="195" y="24" width="146" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="268" y="52.775000000000006" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>調査</tspan></text>
<text x="268" y="72.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>調査モードのとき</tspan></text>
<text x="268" y="90.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>文献を集める</tspan></text>
<path d="M344 66 L364 66" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="367" y="24" width="146" height="84" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="440" y="52.775000000000006" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle"><tspan>HCD ⇄ FRG</tspan></text>
<text x="440" y="72.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>回路と機能の分解</tspan></text>
<text x="440" y="90.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>食い違いを調整</tspan></text>
<path d="M516 66 L536 66" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="539" y="24" width="146" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="612" y="61.837500000000006" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>CSV</tspan></text>
<text x="612" y="81.1875" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>5 つの表</tspan></text>
