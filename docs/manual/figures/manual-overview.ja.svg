<text x="784" y="72.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>CoBRAC 形式</tspan></text>
<text x="784" y="90.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Template-v2-2</tspan></text>
<text x="440" y="140" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan>成果物は各ステップの後にプロジェクト画面に出ます</tspan></text>
<path d="M440 160 L440 112" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-f59e0b)"/>
<rect x="195" y="160" width="490" height="70" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="207" y="181.775" font-size="14" font-weight="700" fill="#92400e" text-anchor="start"><tspan>エージェント欄</tspan></text>
<text x="207" y="201.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>質問が来たら回答する（作業はそこで止まって待つ）</tspan></text>
<text x="207" y="219.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan>完了後は「追加の指示」で直す</tspan></text>
</svg>
