<text x="119" y="94.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>password (10+ chars)</tspan></text>
<circle cx="28" cy="28" r="11" fill="#3b82f6"/><text x="28" y="32.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
