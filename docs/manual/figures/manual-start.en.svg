<text x="339" y="76.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>enter the code</tspan></text>
<text x="339" y="94.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>from the e-mail</tspan></text>
<circle cx="248" cy="28" r="11" fill="#3b82f6"/><text x="248" y="32.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
