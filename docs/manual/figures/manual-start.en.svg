<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">Four steps to get started</title>
<desc id="d">1. Create an account with your e-mail address and a password. 2. Enter the confirmation code from the e-mail. 3. Register your own OpenAI API key in Settings, or have an admin approve you for the default API key. 4. Create a new project with an ROI and a TLF and run it.</desc>
