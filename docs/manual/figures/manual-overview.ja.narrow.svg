<text x="215" y="522.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>質問が来たら回答する</tspan></text>
<text x="215" y="540.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>完了後は「追加の指示」で直す</tspan></text>
