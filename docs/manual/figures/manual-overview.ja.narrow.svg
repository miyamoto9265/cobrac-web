<rect x="20" y="284" width="390" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="215" y="311.8375" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan>CSV</tspan></text>
<text x="215" y="331.1875" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>5 つの表</tspan></text>
