<text x="215" y="428.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>Template-v2-2</tspan></text>
<text x="215" y="462" font-size="12" font-weight="400" fill="#475569" text-anchor="middle"><tspan>成果物は各ステップの後にプロジェクト画面に出ます</tspan></text>
