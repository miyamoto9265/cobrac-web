<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 408" width="430" height="408" role="img" aria-labelledby="t d" lang="ja" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">使い始めるまでの 4 つの手順</title>
<desc id="d">1. メールアドレスとパスワードでアカウントを作る。2. メールに届いた確認コードを入れる。3. 設定画面で自分の OpenAI API キーを登録するか、管理者にデフォルトの API キーの利用を承認してもらう。4. 新規プロジェクトで ROI と TLF を入れて実行する。</desc>
