<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 378" width="430" height="378" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">The project page</title>
<desc id="d">The header shows the name, status, ROI and TLF, model and usage, with stop and retry, the BRA xlsx downloads, publishing, push to Canon and delete; the progress is under it. Tabs switch between the outputs (HCD, FRG, Tables, Report, Decision log, Article). The Agent panel on the right holds the log, questions and the input box. On a phone the Agent panel opens with a button.</desc>
