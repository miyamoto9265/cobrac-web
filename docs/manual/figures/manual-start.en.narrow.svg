<text x="220" y="230.7125" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle"><tspan>Approval</tspan></text>
<text x="220" y="250.0625" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>have an admin</tspan></text>
<text x="220" y="268.1875" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>approve you (or use</tspan></text>
<text x="220" y="286.3125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>your own API key)</tspan></text>
<circle cx="34" cy="220" r="11" fill="#3b82f6"/><text x="34" y="224.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>3</tspan></text>
<path d="M220 292 L220 312" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
