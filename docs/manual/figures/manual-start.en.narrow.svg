<text x="220" y="63.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>e-mail address and</tspan></text>
<text x="220" y="81.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>password (10+ chars)</tspan></text>
<circle cx="34" cy="24" r="11" fill="#3b82f6"/><text x="34" y="28.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>1</tspan></text>
<path d="M220 96 L220 116" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
<rect x="30" y="118" width="380" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="220" y="141.775" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan>Confirm</tspan></text>
<text x="220" y="161.125" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>enter the code</tspan></text>
<text x="220" y="179.25" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan>from the e-mail</tspan></text>
<circle cx="34" cy="122" r="11" fill="#3b82f6"/><text x="34" y="126.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan>2</tspan></text>
<path d="M220 194 L220 214" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-64748b)"/>
