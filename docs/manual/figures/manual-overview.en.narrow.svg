<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 574" width="430" height="574" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="t">How CoBRAC Agents works: from ROI and TLF to BRA data</title>
<desc id="d">Enter an ROI (region of interest) and a TLF (top-level function) and run: the agent does the research (in research mode), the HCD and FRG with round trips between them, the CSV files and the BRA xlsx. Each output appears on the project page when its step is done. Answer questions in the Agent panel; after completion, send follow-up instructions to change the result.</desc>
